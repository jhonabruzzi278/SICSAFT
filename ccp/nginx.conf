# SPA con react-router-dom (BrowserRouter) — cualquier ruta que no matchee un archivo real cae a
# index.html, si no /activos, /contratos, etc. devuelven 404 de nginx en vez de dejar que React
# Router resuelva la ruta client-side.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
