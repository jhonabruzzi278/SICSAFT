<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SICSAFT — Modelo ER de la Base Patrimonial</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 66ch;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER / Data Model · SICSAFT</p>
    <h1>Base Patrimonial — modelo de datos</h1>
    <p class="subtitle">Entidades núcleo de <code>core/migrations/</code>. Organización es cache de solo lectura de Keycloak (ADR-004, reemplaza a Zitadel); el resto vive únicamente en la Base Patrimonial Central.</p>

    <svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sicsaft-er-title sicsaft-er-desc">
      <title id="sicsaft-er-title">Modelo ER de la Base Patrimonial de SICSAFT</title>
      <desc id="sicsaft-er-desc">Organización como raíz de la que cuelgan Sede, Contrato y Activo; Contrato y Sede se relacionan N a N vía contrato_sedes, y Activo referencia opcionalmente a un Responsable.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== RELATIONSHIP LINES (before boxes) ===== -->

      <!-- Organizacion -> Sede (1:N) -->
      <path d="M 440,128 V 152 Q 440,160 432,160 H 198 Q 190,160 190,168 V 200"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="426" y="134" width="14" height="12" rx="2" fill="#f5f5f5"/>
      <text x="433" y="144" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="176" y="180" width="20" height="12" rx="2" fill="#f5f5f5"/>
      <text x="186" y="190" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

      <!-- Organizacion -> Contrato (1:N) -->
      <path d="M 560,128 V 152 Q 560,160 568,160 H 802 Q 810,160 810,168 V 192"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="560" y="134" width="14" height="12" rx="2" fill="#f5f5f5"/>
      <text x="567" y="144" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="800" y="172" width="20" height="12" rx="2" fill="#f5f5f5"/>
      <text x="810" y="182" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

      <!-- Organizacion -> Activo (1:N, straight) -->
      <line x1="500" y1="128" x2="500" y2="360" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="508" y="160" width="14" height="12" rx="2" fill="#f5f5f5"/>
      <text x="515" y="170" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="508" y="336" width="20" height="12" rx="2" fill="#f5f5f5"/>
      <text x="518" y="346" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

      <!-- Sede <-> Contrato (N:N via contrato_sedes, straight) -->
      <line x1="300" y1="252" x2="700" y2="252" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="308" y="230" width="20" height="12" rx="2" fill="#f5f5f5"/>
      <text x="318" y="240" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>
      <rect x="672" y="230" width="20" height="12" rx="2" fill="#f5f5f5"/>
      <text x="682" y="240" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>
      <rect x="450" y="230" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="240" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">contrato_sedes</text>

      <!-- Activo -> Responsable (0..1, straight) -->
      <line x1="610" y1="428" x2="700" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="616" y="406" width="20" height="12" rx="2" fill="#f5f5f5"/>
      <text x="626" y="416" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>
      <rect x="662" y="406" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="678" y="416" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0..1</text>

      <!-- ===== ENTITIES ===== -->

      <!-- ORGANIZACION (focal, root) -->
      <g>
        <rect x="390" y="40" width="220" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <line x1="390" y1="64" x2="610" y2="64" stroke="#eb6c36" stroke-width="0.8"/>
        <rect x="398" y="46" width="46" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="421" y="55" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENTITY</text>
        <text x="500" y="57" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Organización</text>
        <text x="402" y="80" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace"># id</text>
        <text x="402" y="96" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">nombre</text>
        <text x="402" y="112" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">estado</text>
      </g>

      <!-- SEDE -->
      <g>
        <rect x="80" y="200" width="220" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="80" y1="224" x2="300" y2="224" stroke="#2d3142" stroke-width="0.8"/>
        <rect x="88" y="206" width="46" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="111" y="215" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENTITY</text>
        <text x="190" y="217" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sede</text>
        <text x="92" y="240" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace"># id</text>
        <text x="92" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ organizacion_id</text>
        <text x="92" y="272" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">nombre</text>
        <text x="92" y="288" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">estado</text>
      </g>

      <!-- CONTRATO -->
      <g>
        <rect x="700" y="192" width="220" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="700" y1="216" x2="920" y2="216" stroke="#2d3142" stroke-width="0.8"/>
        <rect x="708" y="198" width="46" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="731" y="207" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENTITY</text>
        <text x="810" y="209" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contrato</text>
        <text x="712" y="232" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace"># id</text>
        <text x="712" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ organizacion_id</text>
        <text x="712" y="264" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">vigencia_desde/hasta</text>
        <text x="712" y="280" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">estado</text>
        <text x="712" y="296" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">modulos_contratados[]</text>
      </g>

      <!-- ACTIVO -->
      <g>
        <rect x="390" y="360" width="220" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="390" y1="384" x2="610" y2="384" stroke="#2d3142" stroke-width="0.8"/>
        <rect x="398" y="366" width="46" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="421" y="375" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENTITY</text>
        <text x="500" y="377" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Activo</text>
        <text x="402" y="400" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace"># id</text>
        <text x="402" y="416" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">codigo_patrimonial</text>
        <text x="402" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ organizacion_id</text>
        <text x="402" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ catalogo_id</text>
        <text x="402" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→ responsable_id (0..1)</text>
        <text x="402" y="480" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">estado</text>
      </g>

      <!-- RESPONSABLE -->
      <g>
        <rect x="700" y="376" width="220" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <line x1="700" y1="400" x2="920" y2="400" stroke="#2d3142" stroke-width="0.8"/>
        <rect x="708" y="382" width="46" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="731" y="391" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENTITY</text>
        <text x="810" y="393" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Responsable</text>
        <text x="712" y="416" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace"># id</text>
        <text x="712" y="432" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">identificacion</text>
        <text x="712" y="448" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">nombre</text>
        <text x="712" y="464" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">estado</text>
      </g>

      <!-- ===== LEGEND ===== -->
      <line x1="30" y1="524" x2="970" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="140" y="532" width="12" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="158" y="542" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Raíz (cache de identidad Keycloak)</text>

      <text x="420" y="542" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">#</text>
      <text x="434" y="542" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Clave primaria</text>

      <text x="580" y="542" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">→</text>
      <text x="594" y="542" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Clave foránea</text>

      <line x1="720" y1="537" x2="748" y2="537" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="756" y="542" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Relación N:N</text>
    </svg>
  </div>
</body>
</html>
