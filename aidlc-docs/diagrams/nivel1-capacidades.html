<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SICSAFT — Capacidades Nivel 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 68ch;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · SICSAFT · Nivel 1</p>
    <h1>Capacidades y responsabilidades — Nivel 1</h1>
    <p class="subtitle">Qué hace cada rol y cada sistema, no solo qué capacidades expone. El flujo detallado de captura de la APP QR vive aparte — ver <a href="nivel1-flujo-captura-qr.html">nivel1-flujo-captura-qr.html</a>.</p>

    <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="n1-cap-title n1-cap-desc">
      <title id="n1-cap-title">Capacidades y responsabilidades de SICSAFT Nivel 1 por rol y por sistema</title>
      <desc id="n1-cap-desc">Los tres roles de Nivel 1 (Profesional de AFT, Directivo, Administrador del Sistema) entran hacia CIS, que valida identidad y hace de proxy hacia CORE; CORE aplica reglas de negocio antes de escribir en la Base Patrimonial (que nunca borra registros oficiales, solo cambia su estado) y emite eventos asíncronos que CIP consume para dashboards.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== ARROWS (before nodes) ===== -->

      <!-- AFT -> APP QR (straight, shared x) -->
      <line x1="180" y1="116" x2="180" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- APP QR -> CIS (elbow, link) -->
      <path d="M 180,204 V 228 Q 180,236 188,236 H 432 Q 440,236 440,244 V 248"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Directivo -> CIS (straight, shared x) -->
      <line x1="500" y1="116" x2="500" y2="248" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Admin -> CIS (elbow, link) -->
      <path d="M 820,116 V 228 Q 820,236 812,236 H 568 Q 560,236 560,244 V 248"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="466" y="224" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="233" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS/OIDC</text>

      <!-- CIS -> CORE (straight) -->
      <line x1="500" y1="340" x2="500" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- CORE -> BPI (straight, accent) -->
      <line x1="500" y1="456" x2="500" y2="496" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="508" y="464" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="512" y="476" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">VALIDA + ESCRIBE</text>

      <!-- CORE -> CIP (elbow, dashed async) -->
      <path d="M 620,418 H 660 Q 668,418 668,410 V 402 Q 668,394 676,394 H 700"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="626" y="386" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="652" y="395" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENTOS</text>

      <!-- ===== ROLE NODES (row 1) ===== -->
      <g font-family="'Geist', sans-serif">
        <rect x="40" y="40" width="280" height="76" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="180" y="64" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Profesional AFT</text>
        <text x="180" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">capta activos (QR)</text>
        <text x="180" y="98" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consulta, incidencias</text>

        <rect x="360" y="40" width="280" height="76" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="500" y="64" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Directivo</text>
        <text x="500" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">supervisión ejecutiva</text>
        <text x="500" y="98" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consulta consolidada</text>

        <rect x="680" y="40" width="280" height="76" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="820" y="64" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Administrador Sistema</text>
        <text x="820" y="82" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gestión de usuarios</text>
        <text x="820" y="98" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">configuración, auditoría</text>
      </g>

      <!-- APP QR (small, link to detail) -->
      <rect x="40" y="148" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="180" y="170" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">APP QR</text>
      <text x="180" y="186" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">cámara/manual, offline-first</text>
      <text x="180" y="198" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">→ flujo detallado aparte</text>

      <!-- CIS -->
      <rect x="380" y="248" width="240" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="388" y="256" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="404" y="265" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="500" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CIS</text>
      <text x="500" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">valida OIDC/PKCE (Zitadel)</text>
      <text x="500" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proxy + CORS + rate limit</text>

      <!-- CORE (focal) -->
      <rect x="380" y="380" width="240" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="388" y="388" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="406" y="397" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="500" y="418" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SICSAFT CORE</text>
      <text x="500" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">motor patrimonial + reglas</text>

      <!-- CIP -->
      <rect x="700" y="380" width="260" height="76" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="708" y="388" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="720" y="397" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BI</text>
      <text x="830" y="418" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CIP</text>
      <text x="830" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consume eventos (pg-boss)</text>
      <text x="830" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dashboards, KPIs, cobertura</text>

      <!-- Base Patrimonial (focal) -->
      <rect x="360" y="496" width="280" height="92" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="368" y="504" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="380" y="513" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="500" y="534" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Base Patrimonial Central</text>
      <text x="500" y="552" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">valida reglas antes de escribir</text>
      <text x="500" y="568" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">estado bidireccional — nunca DELETE</text>

      <!-- ===== CAPACIDADES (tag strip) ===== -->
      <rect x="40" y="620" width="920" height="12" rx="2" fill="#f5f5f5"/>
      <text x="40" y="616" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.10em">CAPACIDADES EXPUESTAS · NIVEL 1</text>

      <g font-family="'Geist', sans-serif" font-size="10" fill="#2d3142">
        <rect x="40" y="636" width="144" height="32" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="112" y="656" text-anchor="middle">Identificación</text>

        <rect x="196" y="636" width="144" height="32" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="268" y="656" text-anchor="middle">Consulta</text>

        <rect x="352" y="636" width="144" height="32" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="424" y="656" text-anchor="middle">Inventarios</text>

        <rect x="508" y="636" width="144" height="32" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="580" y="656" text-anchor="middle">Incidencias</text>

        <rect x="664" y="636" width="144" height="32" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="736" y="656" text-anchor="middle">Historial</text>

        <rect x="820" y="636" width="144" height="32" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="892" y="656" text-anchor="middle" font-size="9">Trazabilidad</text>
      </g>

      <!-- ===== LEGEND ===== -->
      <line x1="30" y1="704" x2="970" y2="704" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="150" y="712" width="12" height="12" rx="3" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="168" y="722" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rol / persona</text>

      <rect x="320" y="712" width="12" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="338" y="722" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Motor / dato único</text>

      <rect x="540" y="712" width="12" height="12" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="558" y="722" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Consumidor asíncrono (CIP)</text>
    </svg>
  </div>
</body>
</html>
