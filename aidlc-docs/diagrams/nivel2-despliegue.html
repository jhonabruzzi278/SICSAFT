<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SICSAFT — Despliegue Nivel 2 (QR + WEB)</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 68ch;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · SICSAFT · Nivel 2</p>
    <h1>Despliegue Nivel 2 — + CCP</h1>
    <p class="subtitle">Con el perfil <code>nivel2</code> activo, <code>podman-compose</code> agrega un único contenedor más — <code>ccp</code> — detrás de Traefik; <code>web-admin</code> y <code>core-frontend</code> ya venían desde Nivel 1 (docker-compose.yml, rev. 2026-08-25).</p>

    <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="n2-dep-title n2-dep-desc">
      <title id="n2-dep-title">Despliegue on-premise de SICSAFT Nivel 2</title>
      <desc id="n2-dep-desc">Sobre la base de Nivel 1 (app-qr-sicsaft, web-admin, core-frontend, todos vía CIS), Traefik suma el enrutamiento hacia ccp dentro de la misma máquina Podman en WSL2; CIS llama a CORE, y CORE junto con Zitadel escriben en el mismo Postgres compartido.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== ZONE ===== -->
      <rect x="60" y="40" width="900" height="640" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="76" y="44" width="280" height="12" rx="2" fill="#f5f5f5"/>
      <text x="84" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.10em">MÁQUINA PODMAN (WSL2) · RED SICSAFT</text>

      <!-- ===== NETWORK PATHS (before nodes) ===== -->

      <!-- Traefik -> CIS -->
      <path d="M 460,196 V 224 Q 460,232 452,232 H 248 Q 240,232 240,240 V 268"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="216" y="212" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="246" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP:3000</text>

      <!-- Traefik -> Zitadel -->
      <path d="M 540,196 V 224 Q 540,232 548,232 H 752 Q 760,232 760,240 V 268"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="724" y="212" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="754" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP:8080</text>

      <!-- CIS -> CORE (straight, shared x) -->
      <line x1="240" y1="344" x2="240" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="248" y="358" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="278" y="367" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP:3001</text>


      <!-- CORE -> Postgres -->
      <path d="M 240,496 V 524 Q 240,532 248,532 H 452 Q 460,532 460,540 V 568"
            fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="330" y="512" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="352" y="521" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5432</text>

      <!-- Zitadel -> Postgres -->
      <path d="M 760,304 V 500 Q 760,508 752,508 H 548 Q 540,508 540,516 V 568"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="736" y="488" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="758" y="497" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5432</text>

      <!-- ===== NODES ===== -->

      <!-- TRAEFIK (4 chips, all solid now) -->
      <g>
        <rect x="380" y="80" width="240" height="116" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="388" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="402" y="97" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LB</text>
        <text x="500" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Traefik</text>
        <rect x="396" y="118" width="100" height="20" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="404" y="132" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">app-qr</text>
        <text x="488" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">n1</text>
        <rect x="504" y="118" width="100" height="20" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="512" y="132" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">web-admin</text>
        <rect x="396" y="142" width="208" height="20" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="404" y="156" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">core-frontend</text>
        <text x="596" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">n1</text>
        <rect x="396" y="166" width="208" height="20" rx="4" fill="rgba(45,49,66,0.05)" stroke="#eb6c36" stroke-width="1"/>
        <text x="404" y="180" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">ccp</text>
        <text x="596" y="180" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">nuevo</text>
      </g>

      <!-- CIS -->
      <g>
        <rect x="140" y="268" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="148" y="276" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="164" y="285" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTR</text>
        <text x="240" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CIS</text>
        <rect x="156" y="308" width="168" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="164" y="324" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">cis</text>
        <text x="316" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">latest</text>
      </g>

      <!-- ZITADEL -->
      <g>
        <rect x="660" y="268" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="668" y="276" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="684" y="285" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTR</text>
        <text x="760" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Zitadel</text>
        <rect x="676" y="308" width="168" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="684" y="324" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">zitadel</text>
        <text x="836" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v2.65.0</text>
      </g>

      <!-- CORE (focal) -->
      <g>
        <rect x="140" y="388" width="200" height="108" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="148" y="396" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="164" y="405" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTR</text>
        <text x="240" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SICSAFT CORE</text>
        <rect x="156" y="428" width="168" height="24" rx="4" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1"/>
        <text x="164" y="444" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">core</text>
        <text x="316" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">latest</text>
        <rect x="156" y="460" width="168" height="24" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="164" y="476" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">core-migrate</text>
        <text x="316" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">job</text>
      </g>

      <!-- POSTGRES (focal) -->
      <g>
        <rect x="400" y="568" width="200" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="408" y="576" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="424" y="585" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTR</text>
        <text x="500" y="594" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
        <rect x="416" y="608" width="168" height="24" rx="4" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1"/>
        <text x="424" y="624" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">postgres</text>
        <text x="576" y="624" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">16-bookworm</text>
      </g>

      <!-- ===== LEGEND ===== -->
      <line x1="80" y1="700" x2="940" y2="700" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="716" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="190" y="708" width="12" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="208" y="718" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Contenedor</text>

      <rect x="320" y="708" width="12" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="338" y="718" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Focal (orquestador / store compartido)</text>

      <rect x="610" y="708" width="12" height="12" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="628" y="718" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Job puntual</text>
    </svg>
  </div>
</body>
</html>
