<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SICSAFT — Flujo outbox CORE → CIP</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 0.5rem; }
    p.subtitle { font-family: var(--font-sans); font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.5rem; max-width: 74ch; }
    svg { width: 100%; min-width: 940px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · SICSAFT</p>
    <h1>Patrón outbox: de un evento de CORE a un agregado de CIP</h1>
    <p class="subtitle">La tabla <code>eventos_outbox</code> nunca se escribe desde código de aplicación — la llena un trigger de Postgres. El worker de CIP no confía en el payload del evento: vuelve a pedirle el catálogo fresco a CORE antes de agregar.</p>

    <svg viewBox="0 0 1080 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sicsaft-outbox-title sicsaft-outbox-desc">
      <title id="sicsaft-outbox-title">Flujo del patrón outbox de CORE hacia CIP</title>
      <desc id="sicsaft-outbox-desc">CORE inserta un evento que un trigger de Postgres copia a una tabla outbox; un dispatcher la sondea cada 5 segundos y publica en una cola BullMQ; un worker de CIP consume el mensaje, vuelve a pedirle el catálogo a CORE, y escribe el agregado en su propia base de datos.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- LIFELINES — CORE 140 · BullMQ 400 · CIP Worker 680 · CIP DB 960 -->
      <line x1="140" y1="128" x2="140" y2="584" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="400" y1="128" x2="400" y2="584" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="680" y1="128" x2="680" y2="584" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="960" y1="128" x2="960" y2="584" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ACTIVATION BARS -->
      <rect x="676" y="392" width="8" height="140" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- M1: CORE self — INSERT eventos + trigger -->
      <path d="M 140,176 C 188,176 188,200 140,200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="150" y="180" width="180" height="16" rx="2" fill="#f5f5f5"/>
      <text x="240" y="191" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">INSERT EVENTOS → TRIGGER → OUTBOX</text>

      <!-- M2: CORE self — dispatcher poll -->
      <path d="M 140,232 C 188,232 188,256 140,256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="150" y="236" width="164" height="16" rx="2" fill="#f5f5f5"/>
      <text x="232" y="247" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">@INTERVAL(5S) · SELECT PENDIENTES</text>

      <!-- M3: CORE -> BullMQ -->
      <line x1="144" y1="288" x2="396" y2="288" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="200" y="272" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="270" y="282" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUEUE.ADD(CIP-EVENTOS)</text>

      <!-- M4: BullMQ --> CORE (return) -->
      <line x1="400" y1="320" x2="148" y2="320" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="228" y="304" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="270" y="314" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JOBID</text>

      <!-- M5: BullMQ -> CIP Worker (async, open marker) -->
      <line x1="400" y1="360" x2="676" y2="360" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="484" y="344" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="538" y="354" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JOB · ASYNC</text>

      <!-- M6: CIP Worker self — procesarMensaje -->
      <path d="M 680,392 C 728,392 728,416 680,416" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="690" y="396" width="152" height="16" rx="2" fill="#f5f5f5"/>
      <text x="766" y="407" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">AGREGACIONSERVICE.PROCESAR()</text>

      <!-- M7: CIP Worker -> CORE (refetch) -->
      <line x1="676" y1="448" x2="144" y2="448" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="212" y="432" width="220" height="12" rx="2" fill="#f5f5f5"/>
      <text x="322" y="442" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /CATALOGO · REFETCH FRESCO</text>

      <!-- M8: CORE --> CIP Worker (headline success) -->
      <line x1="140" y1="480" x2="672" y2="480" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="352" y="464" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="406" y="474" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · CATÁLOGO</text>

      <!-- M9: CIP Worker -> CIP DB -->
      <line x1="684" y1="512" x2="956" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="748" y="496" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="506" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPSERT VEREDICTO/COBERTURA</text>

      <!-- M10: CIP DB --> CIP Worker (return) -->
      <line x1="960" y1="544" x2="688" y2="544" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="788" y="528" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="538" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OK</text>

      <!-- ACTOR BOXES -->
      <rect x="68" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="76" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="94" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="140" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CORE</text>
      <text x="140" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eventos + dispatcher</text>

      <rect x="328" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="336" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="354" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MQ</text>
      <text x="400" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BullMQ</text>
      <text x="400" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cola cip-eventos</text>

      <rect x="608" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="616" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="632" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
      <text x="680" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CIP Worker</text>
      <text x="680" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AgregacionModule</text>

      <rect x="888" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="896" y="80" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="916" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="960" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CIP DB</text>
      <text x="960" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Postgres separada</text>

      <!-- LEGEND -->
      <line x1="56" y1="600" x2="1024" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="56" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="56" y="628" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="76" y="636" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Payload que dispara la agregación</text>
      <line x1="300" y1="632" x2="328" y2="632" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="336" y="636" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Llamada HTTP</text>
      <line x1="460" y1="632" x2="488" y2="632" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="496" y="636" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Respuesta</text>
      <line x1="600" y1="632" x2="628" y2="632" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="636" y="636" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Consumo async de cola</text>
    </svg>
  </div>
</body>
</html>
