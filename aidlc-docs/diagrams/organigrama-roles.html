<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SICSAFT — Organigrama de roles y sistemas</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 68ch;
    }
    svg { width: 100%; min-width: 980px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Org chart · SICSAFT · sistema completo</p>
    <h1>Roles y qué sistema tiene cada uno</h1>
    <p class="subtitle">No es una jerarquía de mando — es un mapa de responsabilidad: quién administra los accesos, qué rol usa qué portal, y qué pieza sigue sin construirse (DOC-025).</p>

    <svg viewBox="0 0 1040 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="org-title org-desc">
      <title id="org-title">Organigrama de roles y sistemas de SICSAFT</title>
      <desc id="org-desc">El Administrador del Sistema provisiona los accesos de los otros dos roles vía Zitadel; el Profesional de AFT usa la APP QR y CCP, con un tercer portal liviano todavía sin construir, mientras el Directivo usa únicamente Core Frontend.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="1040" height="620" fill="#f5f5f5"/>

      <text x="40" y="64" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.16em">PUNTO DE ACCESO</text>
      <text x="40" y="196" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.16em">ROLES</text>
      <text x="40" y="348" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.16em">PORTALES / SISTEMAS</text>
      <line x1="36" y1="148" x2="1004" y2="148" stroke="rgba(45,49,66,0.12)"/>
      <line x1="36" y1="300" x2="1004" y2="300" stroke="rgba(45,49,66,0.12)"/>

      <!-- ===== CONNECTORS ===== -->
      <path d="M 520 120 L 520 172 L 380 172 L 380 220" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 520 172 L 660 172 L 660 220" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <path d="M 380 268 L 380 324 L 228 324 L 228 372" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 380 324 L 380 372" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 380 324 L 540 324 L 540 372" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 660 268 L 660 320 L 720 320 L 720 372" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <!-- ===== ROOT (front door) ===== -->
      <rect x="420" y="72" width="200" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="428" y="80" width="60" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.55" stroke-width="0.8"/>
      <text x="458" y="89" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="0.08em">ACCESOS</text>
      <text x="520" y="104" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Administrador Sistema</text>
      <text x="520" y="116" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">web_admin · provisiona vía Zitadel</text>

      <!-- ===== TIER 1: roles ===== -->
      <rect x="280" y="220" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="288" y="228" width="32" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="304" y="237" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="0.08em">ROL</text>
      <text x="380" y="252" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Profesional AFT</text>
      <text x="380" y="264" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">captura + gestión patrimonial</text>

      <rect x="560" y="220" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="568" y="228" width="32" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="584" y="237" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="0.08em">ROL</text>
      <text x="660" y="252" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Directivo</text>
      <text x="660" y="264" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">supervisión ejecutiva</text>

      <!-- ===== TIER 2: portales / sistemas ===== -->
      <rect x="160" y="372" width="136" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="228" y="400" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">APP QR</text>
      <text x="228" y="416" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">Nivel 1 · campo</text>

      <rect x="312" y="372" width="136" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="380" y="400" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">CCP</text>
      <text x="380" y="416" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">Nivel 2 · completo</text>

      <rect x="472" y="372" width="136" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="#7a8399" stroke-dasharray="4,4" stroke-width="1"/>
      <text x="540" y="400" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">web-aft</text>
      <text x="540" y="416" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">🔲 planificado</text>

      <rect x="652" y="372" width="136" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="720" y="400" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Core Frontend</text>
      <text x="720" y="416" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" text-anchor="middle">consulta consolidada</text>

      <!-- ===== GAP CALLOUT ===== -->
      <rect x="72" y="460" width="896" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="#7a8399" stroke-dasharray="4,4" stroke-width="1"/>
      <text x="96" y="480" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600">Brecha visible:</text>
      <text x="200" y="480" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9">web-aft (portal liviano de AFT en Nivel 1) no tiene código todavía</text>
      <text x="96" y="496" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9">el rol depende de la APP QR hasta que se construya (DOC-025)</text>

      <!-- ===== LEGEND ===== -->
      <line x1="40" y1="540" x2="1000" y2="540" stroke="rgba(45,49,66,0.12)"/>
      <text x="40" y="564" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9" letter-spacing="0.14em">LEGEND</text>

      <rect x="132" y="552" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="156" y="562" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9">punto de acceso (aprovisiona)</text>

      <rect x="380" y="552" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="404" y="562" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9">rol</text>

      <rect x="460" y="552" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="484" y="562" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9">portal / sistema ya implementado</text>

      <rect x="720" y="552" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="#7a8399" stroke-dasharray="4,4" stroke-width="1"/>
      <text x="744" y="562" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9">planificado — sin código</text>
    </svg>
  </div>
</body>
</html>
