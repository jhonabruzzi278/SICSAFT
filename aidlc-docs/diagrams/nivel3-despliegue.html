<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SICSAFT — Despliegue Nivel 3 (QR + WEB + RFID)</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    .badge-planeado {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--color-accent);
      border: 1px solid rgba(235,108,54,0.5);
      border-radius: 4px;
      padding: 2px 8px;
      margin-left: 0.5rem;
      vertical-align: middle;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 68ch;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · SICSAFT · Nivel 3</p>
    <h1>Despliegue Nivel 3 — RFID <span class="badge-planeado">Planificado — sin código</span></h1>
    <p class="subtitle">No existe un perfil <code>nivel3</code> en <code>docker-compose.yml</code> ni carpeta <code>rfid/</code> en el monorepo (ROADMAP.md). Este layout es una hipótesis de despliegue, no un stack instalable hoy.</p>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="n3-dep-title n3-dep-desc">
      <title id="n3-dep-title">Despliegue hipotético de SICSAFT Nivel 3 — planificado, sin código</title>
      <desc id="n3-dep-desc">Sobre la máquina Podman de Nivel 1/2 ya construida, un hipotético servicio gateway-rfid, todavía sin código, recibiría eventos de lectores RFID físicos y los reenviaría a CIS mediante un conector todavía no implementado.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-planned" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(235,108,54,0.55)"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== ZONE: Podman (ya construido) — starts above its nodes, label clears them ===== -->
      <rect x="60" y="140" width="500" height="396" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="76" y="144" width="300" height="12" rx="2" fill="#f5f5f5"/>
      <text x="84" y="153" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.10em">MÁQUINA PODMAN (WSL2) · YA CONSTRUIDO</text>

      <!-- ===== ZONE: planificado — same top offset, aligned to gateway-rfid's x-range ===== -->
      <rect x="680" y="140" width="280" height="396" rx="8" fill="rgba(235,108,54,0.03)" stroke="rgba(235,108,54,0.35)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="696" y="144" width="220" height="12" rx="2" fill="#f5f5f5"/>
      <text x="704" y="153" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.10em">🔲 PLANIFICADO — SIN CÓDIGO</text>

      <!-- ===== PATHS (before nodes) ===== -->

      <!-- Lectores -> gateway-rfid (planned, straight, shared x) -->
      <line x1="820" y1="112" x2="820" y2="180" stroke="rgba(235,108,54,0.55)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-planned)"/>

      <!-- gateway-rfid -> CIS (planned, elbow, right edge of CIS) -->
      <path d="M 820,280 V 344 Q 820,352 812,352 H 320"
            fill="none" stroke="rgba(235,108,54,0.55)" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-planned)"/>
      <rect x="520" y="336" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="550" y="345" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MQTT?</text>

      <!-- Traefik -> CIS (existing, straight, shared x) -->
      <line x1="220" y1="280" x2="220" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="228" y="292" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="258" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP:3000</text>

      <!-- CIS -> resto del stack (existing, straight, shared x) -->
      <line x1="220" y1="384" x2="220" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="228" y="396" width="46" height="16" rx="2" fill="#f5f5f5"/>
      <text x="232" y="407" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CORE</text>

      <!-- ===== NODES ===== -->

      <!-- Lectores RFID (planned, physical, outside zones) -->
      <rect x="720" y="40" width="200" height="72" rx="6" fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="728" y="48" width="60" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/>
      <text x="758" y="57" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HW</text>
      <text x="820" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lectores RFID</text>
      <text x="820" y="94" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zonas / puntos de control</text>

      <!-- gateway-rfid (planned container, aligned under Lectores, clear of zone label) -->
      <rect x="720" y="180" width="200" height="100" rx="6" fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="728" y="188" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/>
      <text x="744" y="197" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTR</text>
      <text x="820" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gateway-rfid</text>
      <text x="820" y="236" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">🔲 no existe hoy</text>
      <text x="820" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sin Dockerfile, sin repo</text>

      <!-- TRAEFIK (compact, existing, clear of zone label) -->
      <rect x="120" y="180" width="200" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="128" y="188" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="142" y="197" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LB</text>
      <text x="220" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Traefik</text>
      <text x="220" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app-qr · ccp · admin</text>
      <text x="220" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">core-frontend</text>

      <!-- CIS (existing) -->
      <rect x="120" y="320" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="128" y="328" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="144" y="337" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTR</text>
      <text x="220" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CIS</text>
      <text x="220" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">recibiría el conector RFID</text>

      <!-- CORE + resto (compact, existing) -->
      <rect x="120" y="424" width="400" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="320" y="456" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CORE · Postgres · Zitadel</text>
      <text x="320" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sin cambios respecto a Nivel 1/2</text>
      <text x="320" y="492" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(ver nivel2-despliegue.html)</text>

      <!-- ===== LEGEND ===== -->
      <line x1="30" y1="568" x2="970" y2="568" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="584" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="150" y="576" width="12" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="168" y="586" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ya construido</text>

      <rect x="320" y="576" width="12" height="12" rx="3" fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.45)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="338" y="586" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Planificado — sin código ni contenedor real</text>
    </svg>
  </div>
</body>
</html>
