<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SICSAFT — Arquitectura del ecosistema</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 62ch;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · SICSAFT</p>
    <h1>Arquitectura del ecosistema</h1>
    <p class="subtitle">Flujo de datos de extremo a extremo: fuentes de captura y portales entran por CIS, CORE orquesta y escribe en la Base Patrimonial, CIP consume eventos de forma asíncrona para BI.</p>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sicsaft-arq-title sicsaft-arq-desc">
      <title id="sicsaft-arq-title">Arquitectura del ecosistema SICSAFT</title>
      <desc id="sicsaft-arq-desc">Fuentes de captura y los tres portales entran por CIS, que hace de proxy hacia CORE; CORE escribe en la BPI (Base Patrimonial Inteligente) y emite eventos asíncronos que CIP consume para inteligencia de negocio.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== ZONE: Plataforma SICSAFT ===== -->
      <rect x="360" y="148" width="600" height="352" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="376" y="152" width="216" height="12" rx="2" fill="#f5f5f5"/>
      <text x="384" y="161" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.12em">PLATAFORMA SICSAFT (ON-PREM)</text>

      <!-- ===== ARROWS (drawn before nodes) ===== -->

      <!-- Fuentes -> CIS -->
      <path d="M 160,104 V 136 Q 160,144 168,144 H 452 Q 460,144 460,152 V 180"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="290" y="124" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="310" y="133" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <!-- Portales -> CIS -->
      <path d="M 840,104 V 136 Q 840,144 832,144 H 548 Q 540,144 540,152 V 180"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- CIS -> CORE (straight, shared x) -->
      <line x1="500" y1="244" x2="500" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="508" y="264" width="46" height="16" rx="2" fill="#f5f5f5"/>
      <text x="512" y="275" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PROXY</text>

      <!-- CORE -> Base Patrimonial (straight, shared x, accent = primary write path) -->
      <line x1="500" y1="364" x2="500" y2="420" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="508" y="384" width="46" height="16" rx="2" fill="#f5f5f5"/>
      <text x="512" y="395" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">WRITE</text>

      <!-- CORE -> CIP (straight horizontal, shared y, dashed = async) -->
      <line x1="600" y1="332" x2="740" y2="332" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="646" y="312" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="670" y="321" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENTOS</text>

      <!-- ===== NODES ===== -->

      <!-- Fuentes de Captura (input) -->
      <rect x="60" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="60" y="40" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="68" y="48" width="32" height="12" rx="2" fill="transparent" stroke="#7a8399" stroke-width="0.8"/>
      <text x="84" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
      <text x="160" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fuentes de Captura</text>
      <text x="160" y="94" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">APP QR · WEB · RFID · ERP</text>

      <!-- Portales (input) -->
      <rect x="740" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="740" y="40" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="748" y="48" width="32" height="12" rx="2" fill="transparent" stroke="#7a8399" stroke-width="0.8"/>
      <text x="764" y="57" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="840" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Portales</text>
      <text x="840" y="94" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ccp · core/frontend</text>

      <!-- CIS (backend) -->
      <rect x="400" y="180" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="180" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="408" y="188" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="424" y="197" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="500" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CIS</text>
      <text x="500" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NestJS · proxy</text>

      <!-- CORE (focal) -->
      <rect x="400" y="300" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="300" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="408" y="308" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="426" y="317" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="500" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SICSAFT CORE</text>
      <text x="500" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NestJS · orquestador</text>

      <!-- Base Patrimonial (focal, store) -->
      <rect x="380" y="420" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="420" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="388" y="428" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="400" y="437" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="500" y="458" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BPI · Base Patrimonial</text>
      <text x="500" y="474" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PostgreSQL · fuente única de verdad</text>

      <!-- CIP (optional / async) -->
      <rect x="740" y="300" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="740" y="300" width="200" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="748" y="308" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="760" y="317" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BI</text>
      <text x="840" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CIP</text>
      <text x="840" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pg-boss · consumidor async</text>

      <!-- ===== LEGEND ===== -->
      <line x1="30" y1="552" x2="970" y2="552" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="140" y="560" width="12" height="12" rx="3" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="158" y="570" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Actor externo</text>

      <rect x="300" y="560" width="12" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="318" y="570" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Servicio</text>

      <rect x="440" y="560" width="12" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="458" y="570" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Focal (orquestador / dato único)</text>

      <rect x="680" y="560" width="12" height="12" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="698" y="570" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Consumidor asíncrono</text>
    </svg>
  </div>
</body>
</html>
