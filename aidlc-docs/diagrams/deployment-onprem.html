<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SICSAFT — Despliegue on-premise</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    p.subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 68ch;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · SICSAFT</p>
    <h1>Despliegue on-premise (Nivel 1 / Nivel 2)</h1>
    <p class="subtitle">Un contenedor por cliente sobre Podman + WSL2, orquestado por <code>instalar-cliente.ps1</code>. CIS también usa la misma instancia de Redis que CORE (omitido para no duplicar la conexión al mismo store).</p>

    <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sicsaft-dep-title sicsaft-dep-desc">
      <title id="sicsaft-dep-title">Despliegue on-premise de SICSAFT sobre Podman</title>
      <desc id="sicsaft-dep-desc">Traefik enruta hacia CIS y Zitadel dentro de una máquina Podman en WSL2; CIS llama a CORE, y CORE junto con Zitadel escriben en el mismo Postgres compartido, con Redis como caché de CORE.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== ZONE ===== -->
      <rect x="60" y="40" width="900" height="640" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="76" y="44" width="280" height="12" rx="2" fill="#f5f5f5"/>
      <text x="84" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.10em">MÁQUINA PODMAN (WSL2) · RED SICSAFT</text>

      <!-- ===== NETWORK PATHS (before nodes) ===== -->

      <!-- Traefik -> CIS -->
      <path d="M 460,188 V 216 Q 460,224 452,224 H 248 Q 240,224 240,232 V 260"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="216" y="204" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="246" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP:3000</text>

      <!-- Traefik -> Zitadel -->
      <path d="M 540,188 V 216 Q 540,224 548,224 H 752 Q 760,224 760,232 V 260"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="724" y="204" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="754" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP:8080</text>

      <!-- CIS -> CORE (straight, shared x) -->
      <line x1="240" y1="336" x2="240" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="248" y="350" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="278" y="359" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP:3001</text>

      <!-- CORE -> Redis (straight, shared y) -->
      <line x1="340" y1="434" x2="420" y2="434" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="348" y="412" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="370" y="421" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">6379</text>

      <!-- CORE -> Postgres -->
      <path d="M 240,488 V 516 Q 240,524 248,524 H 452 Q 460,524 460,532 V 560"
            fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="330" y="504" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="352" y="513" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5432</text>

      <!-- Zitadel -> Postgres -->
      <path d="M 760,296 V 492 Q 760,500 752,500 H 548 Q 540,500 540,508 V 560"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="736" y="480" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="758" y="489" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">5432</text>

      <!-- ===== NODES ===== -->

      <!-- TRAEFIK -->
      <g>
        <rect x="400" y="80" width="200" height="108" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="88" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="422" y="97" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LB</text>
        <text x="500" y="106" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Traefik</text>
        <!-- chip 1: app-qr-sicsaft -->
        <rect x="416" y="120" width="168" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="424" y="136" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">app-qr-sicsaft</text>
        <text x="576" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">nivel1</text>
        <!-- chip 2: portales nivel 2 (dashed = optional profile) -->
        <rect x="416" y="152" width="168" height="24" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="424" y="168" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">portales</text>
        <text x="576" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">nivel2 ×3</text>
      </g>

      <!-- CIS -->
      <g>
        <rect x="140" y="260" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="148" y="268" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="164" y="277" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTR</text>
        <text x="240" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CIS</text>
        <rect x="156" y="300" width="168" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="164" y="316" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">cis</text>
        <text x="316" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">latest</text>
      </g>

      <!-- ZITADEL -->
      <g>
        <rect x="660" y="260" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="668" y="268" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="684" y="277" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTR</text>
        <text x="760" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Zitadel</text>
        <rect x="676" y="300" width="168" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="684" y="316" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">zitadel</text>
        <text x="836" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">v2.65.0</text>
      </g>

      <!-- CORE (focal) -->
      <g>
        <rect x="140" y="380" width="200" height="108" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="148" y="388" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="164" y="397" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTR</text>
        <text x="240" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SICSAFT CORE</text>
        <rect x="156" y="420" width="168" height="24" rx="4" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1"/>
        <text x="164" y="436" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">core</text>
        <text x="316" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">latest</text>
        <rect x="156" y="452" width="168" height="24" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="164" y="468" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">core-migrate</text>
        <text x="316" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">job</text>
      </g>

      <!-- REDIS -->
      <g>
        <rect x="420" y="396" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="428" y="404" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="444" y="413" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTR</text>
        <text x="520" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis</text>
        <rect x="436" y="436" width="168" height="24" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="444" y="452" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">redis</text>
        <text x="596" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">7-alpine</text>
      </g>

      <!-- POSTGRES (focal) -->
      <g>
        <rect x="400" y="560" width="200" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="408" y="568" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="424" y="577" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CTR</text>
        <text x="500" y="586" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
        <rect x="416" y="600" width="168" height="24" rx="4" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1"/>
        <text x="424" y="616" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">postgres</text>
        <text x="576" y="616" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">16-bookworm</text>
      </g>

      <!-- ===== LEGEND ===== -->
      <line x1="80" y1="700" x2="940" y2="700" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="716" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="190" y="708" width="12" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="208" y="718" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Contenedor</text>

      <rect x="320" y="708" width="12" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="338" y="718" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Focal (orquestador / store compartido)</text>

      <rect x="610" y="708" width="12" height="12" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="628" y="718" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Solo Nivel 2 / job puntual</text>
    </svg>
  </div>
</body>
</html>
