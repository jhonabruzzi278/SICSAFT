<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SICSAFT — Ciclo de vida de un Activo</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 0.5rem; }
    p.subtitle { font-family: var(--font-sans); font-size: 0.9rem; color: var(--color-muted); margin-bottom: 1.5rem; max-width: 72ch; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · SICSAFT</p>
    <h1>Ciclo de vida de un Activo</h1>
    <p class="subtitle">Transiciones reales de <code>EscrituraActivoService</code> (<code>core/src/patrimonial/</code>). "Dado de baja" es terminal en el código actual — nunca se borra la fila, solo cambia <code>estado</code> (invariante de Tomo III 4.10).</p>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sicsaft-estado-title sicsaft-estado-desc">
      <title id="sicsaft-estado-title">Ciclo de vida del estado de un Activo en SICSAFT</title>
      <desc id="sicsaft-estado-desc">Un activo nace en estado Activo, puede ir y volver de Extraviado, y desde cualquiera de esos dos estados pasa a Dado de baja, que es terminal; En tránsito existe en el esquema pero no tiene ninguna transición implementada todavía.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== TRANSITIONS (before states) ===== -->

      <!-- Start -> Activo -->
      <line x1="68" y1="200" x2="120" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="72" y="184" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="94" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALTA</text>

      <!-- Activo -> Extraviado (no evidenciado en código, dashed) -->
      <line x1="320" y1="200" x2="440" y2="200" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="336" y="180" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">? · PENDIENTE</text>

      <!-- Extraviado -> Activo (REINCORPORACION, curved, real) -->
      <path d="M 440,160 C 440,96, 320,96, 320,160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="320" y="86" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="95" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">REINCORPORACION</text>

      <!-- Extraviado -> Dado de baja (straight, real) -->
      <line x1="528" y1="240" x2="528" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="536" y="272" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="540" y="283" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">BAJA</text>

      <!-- Activo -> Dado de baja (curved, real) -->
      <path d="M 220,240 C 220,320, 340,368, 440,368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="228" y="300" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="248" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">BAJA</text>

      <!-- Dado de baja -> End -->
      <line x1="528" y1="416" x2="528" y2="440" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="536" y="418" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="574" y="429" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SIN RETORNO</text>

      <!-- Start dot -->
      <circle cx="60" cy="200" r="6" fill="#2d3142"/>

      <!-- ===== STATES ===== -->

      <!-- Activo -->
      <rect x="120" y="160" width="200" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="128" y="168" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="150" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="220" y="208" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Activo</text>
      <text x="220" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">operativo · escaneable</text>

      <!-- Extraviado -->
      <rect x="440" y="160" width="176" height="80" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="448" y="168" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="470" y="177" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="528" y="208" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Extraviado</text>
      <text x="528" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no localizado</text>

      <!-- Dado de baja (focal, terminal) -->
      <rect x="440" y="320" width="176" height="96" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="448" y="328" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="470" y="337" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="528" y="368" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dado de baja</text>
      <text x="528" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fila conservada</text>
      <text x="528" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nunca DELETE</text>

      <!-- En transito (reservado, sin conectar) -->
      <rect x="760" y="160" width="176" height="80" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="768" y="168" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="790" y="177" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="848" y="208" fill="rgba(45,49,66,0.60)" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">En tránsito</text>
      <text x="848" y="224" fill="rgba(79,93,117,0.70)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reservado · sin código</text>

      <!-- End ring dot -->
      <circle cx="528" cy="448" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="528" cy="448" r="5" fill="#2d3142"/>

      <!-- ===== LEGEND ===== -->
      <line x1="60" y1="500" x2="940" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="60" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="170" y="508" width="12" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="188" y="518" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Estado activo</text>

      <rect x="320" y="508" width="12" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="338" y="518" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Terminal</text>

      <rect x="450" y="508" width="12" height="12" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="468" y="518" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Reservado / sin implementar</text>

      <line x1="700" y1="514" x2="728" y2="514" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="736" y="518" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Transición sin código</text>
    </svg>
  </div>
</body>
</html>
