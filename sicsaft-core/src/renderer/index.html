<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      El <meta> Content-Security-Policy lo inyecta acá el plugin `sicsaft-csp-por-modo` de
      electron.vite.config.ts, distinto según el modo:
        - dev  : incluye 'unsafe-eval' (el HMR de Vite usa eval()/new Function(); sin esto la
                 ventana quedaba en blanco, bug real 2026-08-27) y 'unsafe-inline' para el CSS
                 que Vite sirve inline en dev.
        - prod : estricto, sin 'unsafe-eval' ni 'unsafe-inline' -- Vite bundlea sin eval y el CSS
                 sale a un archivo con <link>. Es lo que SonarCloud (Web:S7039) exige.
    -->
    <!--CSP-->
    <title>SICSAFT CORE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
