# Excluye del analisis de duplicacion (CPD) el boilerplate generado por Nest CLI
# que es intencionalmente identico entre cis/ y core/: son dos servicios
# independientes (sin monorepo/workspace) y compartir codigo real entre ellos
# introduciria acoplamiento a cambio de eliminar duplicacion cosmetica de
# configuracion de herramientas y de specs de humo generados por el schematic.
#
# ccp/, web_admin/, core/frontend/ y app-qr-sicsaft/ son SPAs independientes contra el mismo
# proyecto "CIS" de Zitadel, sin workspace/monorepo compartido (decision de stack no tomada, ver
# adr/) — asi que el boilerplate de bootstrapping/UI que cualquier SPA nueva necesita vuelve a
# aparecer identico o casi identico en cada una: cliente PKCE/OIDC (ADR-002,
# ccp/src/lib/oidc/**, web_admin/src/lib/oidc/**, core/frontend/src/lib/oidc/**,
# app-qr-sicsaft/src/lib/oidc/**), el wrapper de rutas (App.tsx), la pantalla de callback OIDC
# (AuthCallbackPage.tsx), los primitivos de UI sin libreria (ui.tsx, ver ccp/README.md
# "Decisiones de esta primera version") y el patron authorizedFetch/CisApiError de cis-client.ts
# (el resto de ese archivo, los endpoints que expone cada uno, es intencionalmente distinto).
# dashboard-client.ts/DashboardPage.tsx quedan duplicados entre ccp/ y core/frontend/ desde
# DOC-022 4 porque Dashboard es un modulo legitimo tanto del Profesional de AFT (RF-09, anterior
# al rol Directivo) como del Directivo, cada uno en su propio portal.
# GestionarProfesionalAftPage.tsx (core/frontend/) e InicioPage.tsx (core/frontend/) repiten el
# patron de listado+formulario de la seccion "Usuarios" de web_admin/AdminPage.tsx y del hub de
# ccp/HubPage.tsx respectivamente — mismo caso, sin libreria de componentes compartida. Ninguno de
# estos casos tiene nada real que extraer sin introducir el monorepo que este repo decidio no
# tener.
# icons.tsx (set de iconos SVG propio, sin sumar lucide-react solo para el sidebar) y AppShell.tsx
# (shell + sidebar de navegacion) se suman a la misma lista por el mismo motivo (2026-08-20,
# rediseño de sidebar DOC-023): tres SPAs independientes, cada una con su propio sidebar cuyos
# links son intencionalmente distintos entre si (el set de modulos de cada rol) aunque el shell
# que los renderiza sea casi identico.
# public/mockServiceWorker.js es codigo vendor generado al pie de la letra por `npx msw init`
# (mismo archivo, mismo hash, en cualquier proyecto que use MSW) — no es deuda tecnica, mismo
# criterio que eslint.config.mjs arriba. tests/helpers.js entre ccp/ y app-qr-sicsaft/ vuelve a
# ser el caso de dos SPAs independientes sin workspace (ver arriba): cada una siembra su propio
# sessionStorage con su propia clave de tokens (web-sicsaft-oidc-tokens vs qrvault-oidc-tokens),
# no hay nada real que extraer sin introducir el monorepo que este repo decidio no tener.
sonar.cpd.exclusions=**/eslint.config.mjs,**/test/app.e2e-spec.ts,ccp/src/lib/oidc/**,web_admin/src/lib/oidc/**,core/frontend/src/lib/oidc/**,app-qr-sicsaft/src/lib/oidc/**,**/public/mockServiceWorker.js,**/tests/helpers.js,**/src/App.tsx,**/src/pages/AuthCallbackPage.tsx,**/src/components/ui.tsx,**/src/lib/cis-client.ts,**/src/lib/dashboard-client.ts,**/src/pages/DashboardPage.tsx,core/frontend/src/pages/GestionarProfesionalAftPage.tsx,web_admin/src/pages/AdminPage.tsx,core/frontend/src/pages/InicioPage.tsx,ccp/src/pages/HubPage.tsx,**/src/components/icons.tsx,**/src/components/AppShell.tsx

# devops/local/postgres/Dockerfile: docker:S6471 ("runs as root") es falso positivo -- el
# entrypoint oficial de la imagen postgres arranca como root a proposito (corrige permisos del
# data directory, corre initdb) y recien ahi baja privilegios el solo via gosu hacia el usuario
# "postgres" antes de correr el proceso real; forzar USER postgres en el Dockerfile rompe esa
# inicializacion. No se pudo suprimir inline (Dockerfile no admite comentario al final de la
# linea FROM, rompe el parser -- probado antes de este commit), por eso va por properties.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e1.resourceKey=devops/local/postgres/Dockerfile

# devops/prod/prod.example.yaml dispara la regla de "hardcoded credentials" (S2068) por los
# nombres de sus claves (POSTGRES_ADMIN_PASSWORD, ZITADEL_MASTERKEY, etc.), pero es una plantilla
# en texto plano cuyo unico proposito es documentar que variables existen — su propio encabezado
# dice explicitamente "NUNCA se commitea con valores reales rellenados" (ver devops/prod/README.md
# "Flujo"). Es el mismo caso que devops/local/.env.example (no versionado, por eso nunca aparece
# en este analisis) pero versionado a proposito porque sirve de plantilla, no de secreto real.
sonar.exclusions=devops/prod/prod.example.yaml
