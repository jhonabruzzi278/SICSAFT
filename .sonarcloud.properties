# Excluye del analisis de duplicacion (CPD) el boilerplate generado por Nest CLI
# que es intencionalmente identico entre cis/ y core/: son dos servicios
# independientes (sin monorepo/workspace) y compartir codigo real entre ellos
# introduciria acoplamiento a cambio de eliminar duplicacion cosmetica de
# configuracion de herramientas y de specs de humo generados por el schematic.
#
# ccp/, core/frontend/ y app-qr-sicsaft/ son SPAs independientes contra el mismo
# proyecto "CIS" de identidad, sin workspace/monorepo compartido (decision de stack no tomada, ver
# adr/) — asi que el boilerplate de bootstrapping/UI que cualquier SPA nueva necesita vuelve a
# aparecer identico o casi identico en cada una: cliente PKCE/OIDC (ADR-002,
# ccp/src/lib/oidc/**, core/frontend/src/lib/oidc/**,
# app-qr-sicsaft/src/lib/oidc/**), el wrapper de rutas (App.tsx), la pantalla de callback OIDC
# (AuthCallbackPage.tsx), los primitivos de UI sin libreria (ui.tsx, ver ccp/README.md
# "Decisiones de esta primera version") y el patron authorizedFetch/CisApiError de cis-client.ts
# (el resto de ese archivo, los endpoints que expone cada uno, es intencionalmente distinto).
# dashboard-client.ts/DashboardPage.tsx quedan duplicados entre ccp/ y core/frontend/ desde
# DOC-022 4 porque Dashboard es un modulo legitimo tanto del Profesional de AFT (RF-09, anterior
# al rol Directivo) como del Directivo, cada uno en su propio portal.
# GestionarProfesionalAftPage.tsx (core/frontend/) e InicioPage.tsx (core/frontend/) repiten el
# patron de listado+formulario del hub de ccp/HubPage.tsx — mismo caso, sin libreria de
# componentes compartida. Ninguno de
# estos casos tiene nada real que extraer sin introducir el monorepo que este repo decidio no
# tener.
# icons.tsx (set de iconos SVG propio, sin sumar lucide-react solo para el sidebar) y AppShell.tsx
# (shell + sidebar de navegacion) se suman a la misma lista por el mismo motivo (2026-08-20,
# rediseño de sidebar DOC-023): dos SPAs independientes, cada una con su propio sidebar cuyos
# links son intencionalmente distintos entre si (el set de modulos de cada rol) aunque el shell
# que los renderiza sea casi identico.
# public/mockServiceWorker.js es codigo vendor generado al pie de la letra por `npx msw init`
# (mismo archivo, mismo hash, en cualquier proyecto que use MSW) — no es deuda tecnica, mismo
# criterio que eslint.config.mjs arriba. tests/helpers.js entre ccp/ y app-qr-sicsaft/ vuelve a
# ser el caso de dos SPAs independientes sin workspace (ver arriba): cada una siembra su propio
# sessionStorage con su propia clave de tokens (web-sicsaft-oidc-tokens vs qrvault-oidc-tokens),
# no hay nada real que extraer sin introducir el monorepo que este repo decidio no tener.
# gaps-ccp.e2e-spec.ts (cis/ y core/) se renombro desde gaps-ccp-admin-sistema.e2e-spec.ts al
# eliminar el portal web_admin/ (2026-09); Sonar lo cuenta entero como codigo nuevo y su
# scaffolding de e2e (request(app).post(...).set(SERVICE_TOKEN...).send(...).expect(...)) repetido
# por caso dispara CPD sin deuda real, mismo criterio que app.e2e-spec.ts arriba.
# nivel1-arquitectura.html / nivel2-arquitectura.html: al sacar el nodo "Web Admin" quedaron 3
# bloques <rect>+<text> de nodo casi identicos (por diseno del diagrama) y los dos SVG comparten
# markup de nodo entre si — repeticion inherente a un diagrama, no codigo.
sonar.cpd.exclusions=**/eslint.config.mjs,**/test/app.e2e-spec.ts,**/test/gaps-ccp.e2e-spec.ts,aidlc-docs/diagrams/nivel1-arquitectura.html,aidlc-docs/diagrams/nivel2-arquitectura.html,ccp/src/lib/oidc/**,core/frontend/src/lib/oidc/**,app-qr-sicsaft/src/lib/oidc/**,**/public/mockServiceWorker.js,**/tests/helpers.js,**/src/App.tsx,**/src/pages/AuthCallbackPage.tsx,**/src/components/ui.tsx,**/src/lib/cis-client.ts,**/src/lib/dashboard-client.ts,**/src/pages/DashboardPage.tsx,core/frontend/src/pages/GestionarProfesionalAftPage.tsx,core/frontend/src/pages/InicioPage.tsx,ccp/src/pages/HubPage.tsx,**/src/components/icons.tsx,**/src/components/AppShell.tsx

# devops/prod/prod.example.yaml dispara la regla de "hardcoded credentials" (S2068) por los
# nombres de sus claves (POSTGRES_ADMIN_PASSWORD, ZITADEL_MASTERKEY, etc.), pero es una plantilla
# en texto plano cuyo unico proposito es documentar que variables existen — su propio encabezado
# dice explicitamente "NUNCA se commitea con valores reales rellenados" (ver devops/prod/README.md
# "Flujo"). Es el mismo caso que devops/local/.env.example (no versionado, por eso nunca aparece
# en este analisis) pero versionado a proposito porque sirve de plantilla, no de secreto real.
#
# apk-aft/ (DOC-029 RF-H) es el primer y unico modulo Gradle/Kotlin del repo — un shell Android
# minimo (5 archivos) que carga la PWA de sicsaft-core.exe en una WebView. Las reglas de cadena
# de suministro de SonarCloud para Gradle piden infraestructura que este repo no tiene:
# text:S8569 exige un gradle.lockfile / gradle/verification-metadata.xml, que solo se genera
# corriendo `./gradlew --write-locks` con el Android SDK + red (no hay toolchain de Gradle en el
# CI mas alla del build del propio APK, ni precedente de lockfiles en el repo). El wrapper jar
# tampoco se versiona (binario, lo regenera la CI). El modulo se valida en un telefono real
# (aidlc-docs/apk-aft/), no por analisis estatico de dependencias. Se excluye entero — mismo
# criterio de "intencional / infra que no aplica" que el resto de esta lista. Las acciones de
# GitHub del workflow (.github/workflows/apk-aft-ci.yml) SI se mantienen pineadas a SHA
# (githubactions:S7637): eso no depende de ninguna toolchain.
#
# casos-de-uso/e2e/ es el harness de Playwright que levanta el stack REAL por docker compose y
# corre casos de uso end-to-end (ver casos-de-uso/e2e/README.md). No es codigo desplegable (sin
# Dockerfile ni workflow de CI de sistema) y su correccion se prueba ejecutandolo contra el stack,
# no por analisis estatico — mismo criterio que apk-aft/ ("se valida en un telefono real"). Ademas
# usa `http://*.sicsaft.localhost` a proposito (S5332/S1075): bajo ".localhost" el navegador da
# secure context con HTTP plano sin TLS — es requisito para que crypto.subtle/PKCE funcionen, ver
# devops/onprem/.env.example y devops/onprem/instalar-cliente.ps1 New-DominioDesdeNombre. Se
# excluye entero.
sonar.exclusions=devops/prod/prod.example.yaml,apk-aft/**,casos-de-uso/e2e/**

# sicsaft-core/ es la app de escritorio Electron: TODO lo que su proceso principal alcanza por
# red es su propio Postgres/Keycloak/cis/core/cip corriendo como procesos hijos en la MISMA PC
# (127.0.0.1 o la IP de LAN de esa misma maquina, calculada de os.networkInterfaces() para que la
# APP QR del telefono pueda alcanzar Keycloak — ver ARCHITECTURE.md "Red: localhost para el
# escritorio, LAN para el telefono"). El analisis de taint de tssecurity:S7044/S8476 (path /
# SSRF con datos no confiables) marca los fetch() de keycloak-bootstrap.ts porque su URL
# incorpora el resultado de os.networkInterfaces() (la IP de LAN de esta misma PC; su forma ya
# se valida en lan-ip.ts esIpv4Canonica antes de usarla). No hay ninguna superficie de request
# construida con entrada no confiable: el "host" es siempre esta misma maquina, el path lo pasan
# solo llamadores internos con literales fijos, y el renderer nunca llega a esta capa (habla por
# IPC con contextBridge). Elegir la interfaz de LAN equivocada seria un bug de robustez, no un
# SSRF.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=tssecurity:S8476
sonar.issue.ignore.multicriteria.e1.resourceKey=**/keycloak-bootstrap.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=tssecurity:S7044
sonar.issue.ignore.multicriteria.e2.resourceKey=**/keycloak-bootstrap.ts
