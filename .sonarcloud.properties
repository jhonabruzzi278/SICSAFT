# Excluye del analisis de duplicacion (CPD) el boilerplate generado por Nest CLI
# que es intencionalmente identico entre cis/ y core/: son dos servicios
# independientes (sin monorepo/workspace) y compartir codigo real entre ellos
# introduciria acoplamiento a cambio de eliminar duplicacion cosmetica de
# configuracion de herramientas y de specs de humo generados por el schematic.
#
# web/src/lib/oidc/** duplica a proposito app-qr-sicsaft/src/lib/oidc/**: mismo
# cliente PKCE/OIDC contra Zitadel (ADR-002), pero WEB y app-qr-sicsaft son dos
# SPAs independientes sin workspace compartido — ver comentarios de cabecera en
# ambos directorios. Extraerlo a un paquete compartido requeriria introducir un
# monorepo/workspace, decision de stack no tomada (ver adr/).
sonar.cpd.exclusions=**/eslint.config.mjs,**/test/app.e2e-spec.ts,web/src/lib/oidc/**,app-qr-sicsaft/src/lib/oidc/**

# S5332 (clear-text protocol) falso positivo confirmado en web-ci.yml: los `http://*.sicsaft.
# localhost` son build args de un `docker build` de CI que solo produce una imagen descartable
# (`sicsaft-web:ci`, nunca publicada/desplegada) — no es trafico de red real ni credenciales en
# claro. `http://` local sin TLS es la convencion documentada de este repo (devops/local/README.md
# — produccion usa los mismos subdominios bajo `sicsaft.cl` con TLS via Traefik/Let's Encrypt).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/web-ci.yml
