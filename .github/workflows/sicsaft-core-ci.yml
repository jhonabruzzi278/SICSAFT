name: SICSAFT CORE CI

on:
  pull_request:
    paths:
      - "sicsaft-core/**"
      - ".github/workflows/sicsaft-core-ci.yml"
  push:
    branches: [main]
    paths:
      - "sicsaft-core/**"
      - ".github/workflows/sicsaft-core-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: sicsaft-core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:ci

      - name: Type-check
        run: bun run typecheck

      - name: Tests unitarios (Vitest)
        run: bun run test

      - name: Build de bundles Electron
        run: bun run build
