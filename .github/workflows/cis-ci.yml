name: CIS CI

on:
  pull_request:
    paths:
      - "cis/**"
      - ".github/workflows/cis-ci.yml"
  push:
    branches: [main]
    paths:
      - "cis/**"
      - ".github/workflows/cis-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: cis

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:ci

      - name: Unit tests + cobertura
        run: bun run test:cov

      - name: Tests e2e
        run: bun run test:e2e

      - name: Build
        run: bun run build

      - name: Build de imagen Docker
        run: docker build -t sicsaft-cis:ci .
