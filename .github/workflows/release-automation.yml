name: Release & Version Automation

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar, Empaquetar y Publicar Release Oficial
    runs-on: windows-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configurar Python 3.12 (para ETL Contable)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Dependencias de los Subsistemas
        shell: bash
        run: |
          (cd cis && bun install --frozen-lockfile)
          (cd core && bun install --frozen-lockfile)
          (cd core/frontend && bun install --frozen-lockfile)
          (cd ccp && bun install --frozen-lockfile)
          (cd cip && bun install --frozen-lockfile)
          (cd app-qr-sicsaft && bun install --frozen-lockfile)
          (cd sicsaft-core && bun install --frozen-lockfile)

      - name: Ejecutar Pruebas Automatizadas
        shell: bash
        run: |
          (cd cis && bun run test)
          (cd core && bun run test)
          (cd ccp && bun run test)
          (cd sicsaft-core && bun run test)

      - name: Extraer Versión del Tag
        id: get_version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag_name=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          echo "version_raw=$VERSION" >> $GITHUB_OUTPUT

      - name: Pre-empaquetado y Compilación de Frontend / Sidecars
        shell: bash
        run: |
          (cd sicsaft-core && bun run prepack:artefactos)

      - name: Compilar Instalador Windows (.exe)
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          (cd sicsaft-core && bun run dist:win)

      - name: Empaquetar Bundle ZIP de Distribución On-Premise
        shell: powershell
        run: |
          $ver = "${{ steps.get_version.outputs.version_raw }}"
          $zipName = "SICSAFT-v$ver-Windows-OnPremise.zip"
          $distDir = "release-bundle"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          
          # Copiar instalador .exe
          $exeFile = Get-ChildItem -Path "sicsaft-core\release" -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
              Copy-Item $exeFile.FullName -Destination "$distDir\"
          }
          
          # Copiar manuales y guías de instalación
          Copy-Item "sicsaft-core\RUNBOOK-INSTALACION.md" -Destination "$distDir\"
          Copy-Item "devops\onprem\MANUAL-DESPLIEGUE.md" -Destination "$distDir\"
          Copy-Item "CHANGELOG.md" -Destination "$distDir\"
          Copy-Item "VERSION" -Destination "$distDir\"
          
          # Generar checksums SHA256
          Get-ChildItem -Path $distDir -File | ForEach-Object {
              $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)" | Out-File -FilePath "$distDir\CHECKSUMS.sha256" -Append -Encoding utf8
          }
          
          # Crear archivo ZIP final
          Compress-Archive -Path "$distDir\*" -DestinationPath $zipName -Force
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV
          echo "EXE_PATH=$($exeFile.FullName)" >> $env:GITHUB_ENV

      - name: Sincronizar Estado en Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -n "$LINEAR_API_KEY" ]; then
            node herramientas/revision-codigo/linear-sync.mjs --team-key JON --apply
          else
            echo "LINEAR_API_KEY no configurada en GitHub Secrets, omitiendo sync."
          fi
        shell: bash

      - name: Publicar GitHub Release Oficial con Artefactos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: SICSAFT Release ${{ steps.get_version.outputs.tag_name }}
          body: |
            ## SICSAFT Release ${{ steps.get_version.outputs.tag_name }} — Entregable On-Premise
            
            Este release contiene el instalador de escritorio de **SICSAFT CORE** para Windows y su paquete de distribución completo.
            
            ### 📦 Contenido del Paquete:
            - **Instalador de escritorio**: `SICSAFT CORE Setup ${{ steps.get_version.outputs.version_raw }}.exe`
            - **Paquete completo en ZIP**: `SICSAFT-v${{ steps.get_version.outputs.version_raw }}-Windows-OnPremise.zip`
            - **Guía de instalación paso a paso**: `RUNBOOK-INSTALACION.md`
            - **Manual de despliegue on-premise**: `MANUAL-DESPLIEGUE.md`
            - **Verificación de integridad**: `CHECKSUMS.sha256`
            
            Consulta las notas completas en [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          files: |
            ${{ env.ZIP_PATH }}
            sicsaft-core/release/*.exe
          draft: false
          prerelease: false
