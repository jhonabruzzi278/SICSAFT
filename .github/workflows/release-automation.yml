name: Release & Version Automation

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar, Empaquetar y Publicar Release Oficial
    runs-on: windows-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configurar Python 3.12 (para ETL Contable)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Java 17 para APK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK para APK
        # android-actions/setup-android@v3.2.2 instala el paquete legacy "tools", que Google
        # elimino del manifiesto del repositorio del SDK -- sdkmanager corta con "Failed to find
        # package 'tools'" (visto en apk-aft-ci.yml, mismo runner de GitHub, 2026-09-14). El runner
        # windows-latest ya trae un Android SDK funcional (ANDROID_HOME/ANDROID_SDK_ROOT, licencias
        # aceptadas); alcanza con asegurar los paquetes que el proyecto realmente usa (compileSdk/
        # targetSdk 34, ver apk-aft/app/build.gradle.kts), sin pasar por ese paquete roto.
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar Dependencias de los Subsistemas
        shell: bash
        # generador-qr y ccp-desktop instalan con --ignore-scripts (SonarCloud githubactions:S6505):
        # bloquea lifecycle scripts arbitrarios del resto del arbol de dependencias, y se corre a
        # mano solo el install.js de electron (unico paquete que de verdad lo necesita -- descarga
        # el binario de Electron; verificado que build+pack de electron-builder siguen funcionando
        # igual). trustedDependencies de bun no alcanza: --ignore-scripts bloquea TODO sin
        # excepcion, incluidos los paquetes marcados como confiables.
        run: |
          (cd cis && bun install --frozen-lockfile)
          (cd core && bun install --frozen-lockfile)
          (cd core/frontend && bun install --frozen-lockfile)
          (cd ccp && bun install --frozen-lockfile)
          (cd cip && bun install --frozen-lockfile)
          (cd app-qr-sicsaft && bun install --frozen-lockfile)
          (cd herramientas/generador-qr && bun install --frozen-lockfile --ignore-scripts && node node_modules/electron/install.js)
          (cd ccp-desktop && bun install --frozen-lockfile --ignore-scripts && node node_modules/electron/install.js)
          (cd sicsaft-core && bun install --frozen-lockfile)

      - name: Construir APK Android firmada
        id: apk
        shell: bash
        env:
          KS_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.APK_KEY_PASSWORD }}
        working-directory: apk-aft
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "Faltan secretos APK_*; un release oficial no puede salir con debug key." >&2
            exit 1
          fi
          gradle wrapper --gradle-version 8.9
          echo "$KS_B64" | base64 -d > sicsaft-release.jks
          {
            echo "storeFile=sicsaft-release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties
          ./gradlew --no-daemon assembleRelease

      - name: Limpiar secretos APK
        if: always()
        shell: bash
        working-directory: apk-aft
        run: rm -f sicsaft-release.jks keystore.properties

      - name: Ejecutar Pruebas Automatizadas
        shell: bash
        run: |
          (cd cis && bun run test)
          (cd core && bun run test)
          (cd ccp && bun run test)
          (cd ccp-desktop && bun run typecheck && bun run lint:ci)
          (cd sicsaft-core && bun run test)

      - name: Extraer Versión del Tag
        id: get_version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag_name=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          echo "version_raw=$VERSION" >> $GITHUB_OUTPUT

      - name: Pre-empaquetado y Compilación de Frontend / Sidecars
        shell: bash
        run: |
          (cd sicsaft-core && bun run prepack:artefactos)
          test -f apk-aft/app/build/outputs/apk/release/*.apk

      - name: Compilar Instalador Windows (.exe)
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          (cd sicsaft-core && bun run dist:win)

      - name: Empaquetar Bundle ZIP de Distribución On-Premise
        shell: powershell
        run: |
          $ver = "${{ steps.get_version.outputs.version_raw }}"
          $zipName = "SICSAFT-v$ver-Windows-OnPremise.zip"
          $distDir = "release-bundle"
          New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          
          # Copiar instalador .exe
          $exeFile = Get-ChildItem -Path "sicsaft-core\release" -Filter "*.exe" | Select-Object -First 1
          if ($exeFile) {
              Copy-Item $exeFile.FullName -Destination "$distDir\"
          }
          
          # Copiar manuales y guías de instalación
          if (Test-Path "sicsaft-core\RUNBOOK-INSTALACION.md") { Copy-Item "sicsaft-core\RUNBOOK-INSTALACION.md" -Destination "$distDir\" }
          if (Test-Path "CHANGELOG.md") { Copy-Item "CHANGELOG.md" -Destination "$distDir\" }
          if (Test-Path "VERSION") { Copy-Item "VERSION" -Destination "$distDir\" }
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "$distDir\" }
          
          # Generar checksums SHA256
          Get-ChildItem -Path $distDir -File | ForEach-Object {
              $hash = Get-FileHash -Path $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)" | Out-File -FilePath "$distDir\CHECKSUMS.sha256" -Append -Encoding utf8
          }
          
          # Crear archivo ZIP final
          Compress-Archive -Path "$distDir\*" -DestinationPath $zipName -Force
          echo "ZIP_PATH=$zipName" >> $env:GITHUB_ENV
          echo "EXE_PATH=$($exeFile.FullName)" >> $env:GITHUB_ENV

      - name: Sincronizar Estado en Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -n "$LINEAR_API_KEY" ]; then
            node herramientas/revision-codigo/linear-sync.mjs --team-key JON --apply
          else
            echo "LINEAR_API_KEY no configurada en GitHub Secrets, omitiendo sync."
          fi
        shell: bash

      - name: Publicar GitHub Release Oficial con Artefactos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: SICSAFT Release ${{ steps.get_version.outputs.tag_name }}
          body: |
            ## SICSAFT Release ${{ steps.get_version.outputs.tag_name }} — Entregable On-Premise
            
            Este release contiene el instalador único de escritorio de **SICSAFT CORE** para Windows y su paquete de distribución completo, incluido CCP Desktop y el Generador QR interno.
            
            ### 📦 Contenido del Paquete:
            - **Instalador de escritorio**: `SICSAFT CORE Setup ${{ steps.get_version.outputs.version_raw }}.exe`
              (incluye portales, APK, ETL contable, CCP Desktop y Generador QR)
            - **Paquete completo en ZIP**: `SICSAFT-v${{ steps.get_version.outputs.version_raw }}-Windows-OnPremise.zip`
            - **Guía de instalación paso a paso**: `RUNBOOK-INSTALACION.md`
            - **Verificación de integridad**: `CHECKSUMS.sha256`
            
            Consulta las notas completas en [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          files: |
            ${{ env.ZIP_PATH }}
            sicsaft-core/release/*.exe
          draft: false
          prerelease: false
