name: CORE CI

on:
  pull_request:
    paths:
      - "core/**"
      # DOC-022 4 — core/frontend/ es un SPA independiente con su propio workflow
      # (core-frontend-ci.yml); excluirlo acá evita levantar Postgres/correr migraciones/e2e del
      # backend en cambios que solo tocan el frontend.
      - "!core/frontend/**"
      - ".github/workflows/core-ci.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "!core/frontend/**"
      - ".github/workflows/core-ci.yml"

defaults:
  run:
    working-directory: core

jobs:
  test:
    runs-on: ubuntu-latest
    # Base real para GET /entitlements (base-patrimonial/DOC-004-modelo-contrato.md) — mismo
    # esquema que corre en devops/local/docker-compose.yml, ver "Aplicar esquema" abajo.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: core
          POSTGRES_DB: core
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Fase 6 (EventosOutboxModule) — sin password: `services:` de GitHub Actions no soporta
      # pasar `--requirepass` sin una imagen custom (a diferencia de docker-compose local, que sí
      # lo exige, ver devops/local/docker-compose.yml). Contenedor efímero del job, no expone
      # nada real.
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CORE_DB_HOST: localhost
      CORE_DB_PORT: "5432"
      CORE_DB_NAME: core
      CORE_DB_USER: core
      CORE_DB_PASSWORD: core
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests + cobertura
        run: npm run test:cov

      - name: Aplicar migraciones (mismo runner que docker-compose local)
        run: npm run migrate:up

      - name: Tests e2e
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Build de imagen Docker
        run: docker build -t sicsaft-core:ci .
