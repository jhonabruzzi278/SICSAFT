name: CORE CI

on:
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core-ci.yml"
  push:
    branches: [main]
    paths:
      - "core/**"
      - ".github/workflows/core-ci.yml"

defaults:
  run:
    working-directory: core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests + cobertura
        run: npm run test:cov

      - name: Tests e2e
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Build de imagen Docker
        run: docker build -t sicsaft-core:ci .
