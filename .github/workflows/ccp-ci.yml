name: CCP CI

on:
  pull_request:
    paths:
      - "ccp/**"
      - ".github/workflows/ccp-ci.yml"
  push:
    branches: [main]
    paths:
      - "ccp/**"
      - ".github/workflows/ccp-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: ccp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:ci

      - name: Tests unitarios (OIDC/PKCE)
        run: bun run test:cov

      - name: Type-check + build
        run: bun run build

      - name: Instalar Chromium (Playwright)
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Tests e2e
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ccp/playwright-report/
          retention-days: 7

      - name: Build de imagen Docker
        run: |
          # Placeholders sin uso real: esta imagen (sicsaft-ccp:ci) nunca corre ni se publica, solo
          # valida que el Dockerfile buildee. https:// acá (no http://, que sí usan devops/local/
          # y .env.example para el entorno local real sin TLS) evita un falso positivo de
          # "clear-text protocol" (S5332) sobre hosts que jamás se resuelven de verdad.
          docker build \
            --build-arg VITE_KEYCLOAK_ISSUER=https://id.sicsaft.invalid \
            --build-arg VITE_KEYCLOAK_CLIENT_ID=ci-placeholder \
            --build-arg VITE_CIS_URL=https://api.sicsaft.invalid \
            -t sicsaft-ccp:ci .
