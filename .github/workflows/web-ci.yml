name: WEB CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

defaults:
  run:
    working-directory: web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Type-check + build
        run: npm run build

      - name: Build de imagen Docker
        run: |
          docker build \
            --build-arg VITE_ZITADEL_ISSUER=http://id.sicsaft.localhost \
            --build-arg VITE_ZITADEL_CLIENT_ID=ci-placeholder \
            --build-arg VITE_CIS_URL=http://api.sicsaft.localhost \
            -t sicsaft-web:ci .
