# Stack onprem por cliente — instalación aislada (Nivel 1/Nivel 2), ver
# aidlc-docs/devops/design-artifacts/ARCHITECTURE.md para el diseño completo. Subconjunto de
# devops/local/docker-compose.yml, no una copia: sin observabilidad (Prometheus/Loki/Grafana/
# cAdvisor/node-exporter), sin k6, sin dashboard de Traefik expuesto. Pensado para correr con
# `podman-compose` (INST-RNF-01), no Docker Desktop — ver README.md de esta carpeta para el flujo
# de instalación completo.
#
# Niveles (DOC-025 1, revisado 2026-09-02 — unificado con sicsaft-core.exe): Nivel 1 =
# app-qr-sicsaft + ccp (CCP COMPLETO, Profesional de AFT) + web-admin + core-frontend + cip.
# Nivel 2 no agrega ningún servicio nuevo: la única diferencia es el flag VITE_SICSAFT_NIVEL que
# se hornea en el build de `ccp` y decide si el módulo Dashboard/indicadores (CIP) se muestra.
# `instalar-cliente.ps1 -Nivel N` lo pasa por `NIVEL_PRODUCTO` en el .env. El "CCP acotado en
# Nivel 1" del modelo previo quedó revertido.

name: sicsaft-onprem

networks:
  sicsaft:
    driver: bridge

volumes:
  postgres_data:
  # Sin volumen propio para Keycloak (a diferencia de zitadel_data que existía acá antes) — todo su
  # estado real vive en Postgres (KC_DB=postgres), el contenedor en sí es stateless entre reinicios.

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "80:80"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    networks:
      sicsaft:
        # ADR-004 — a diferencia de Zitadel (multi-tenant por dominio, rechazaba requests cuyo Host
        # no fuera uno de sus dominios registrados), Keycloak no necesita este alias por esa razón:
        # el realm va en el path (`/realms/sicsaft/...`), no en el Host. Se mantiene igual porque
        # KC_HOSTNAME queda fijado a `http://id.${DOMINIO_BASE}` (define el `iss` que firma en cada
        # token — verificado real contra un Keycloak 26.0 de prueba, 2026-08-26) y CIS/los
        # frontends arman URLs contra ese mismo host tanto desde el navegador como desde dentro de
        # la red de contenedores — sin este alias, un contenedor que le pegue a `id.${DOMINIO_BASE}`
        # no tendría cómo resolverlo.
        aliases:
          - id.${DOMINIO_BASE}
    restart: unless-stopped

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pgaudit"
      - "-c"
      - "pgaudit.log=write, ddl, role"
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      # CIP entra a Nivel 1 on-premise desde 2026-08-25 (DOC-025 3, cierra INST-Q-01).
      CIP_DB_USER: ${CIP_DB_USER}
      CIP_DB_PASSWORD: ${CIP_DB_PASSWORD}
      # ADR-005 — base dedicada para la cola de eventos CORE→CIP (pg-boss), ver
      # postgres/init/04-eventos-outbox.sh.
      EVENTOS_OUTBOX_DB_USER: ${EVENTOS_OUTBOX_DB_USER}
      EVENTOS_OUTBOX_DB_PASSWORD: ${EVENTOS_OUTBOX_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - sicsaft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # "start" (modo producción), no "start-dev" — exige KC_HOSTNAME/KC_HTTP_ENABLED explícitos en
    # vez de asumir defaults de desarrollo. Sin "--optimized": ese flag requiere una imagen ya
    # compilada con `kc.sh build` (Dockerfile propio) — la imagen oficial sin building extra falla
    # con "was used for first ever server start" (verificado real, 2026-08-26). Costo: unos
    # segundos más de arranque en cada `up`, aceptable para una instalación de cliente que no
    # reinicia seguido.
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Define el `iss` que Keycloak firma en cada token (verificado real: coincide byte a byte
      # con esto, no con el nombre de servicio interno) — CIS (KEYCLOAK_URL) y los 4 frontends
      # (VITE_KEYCLOAK_ISSUER) apuntan al mismo valor exacto, tanto desde el navegador como desde
      # dentro de la red de contenedores (de ahí el alias de Traefik de arriba).
      KC_HOSTNAME: http://id.${DOMINIO_BASE}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Admin humano del realm "master" — solo lo usa bootstrap-keycloak.ps1 (grant_type=password
      # contra admin-cli) para aprovisionar todo lo demás sin pasar por la Console. Equivalente al
      # ZITADEL_ADMIN_USERNAME/PASSWORD que reemplaza; a diferencia de Zitadel, Keycloak no
      # auto-provisiona un PAT de service user — el bootstrap se autentica con estas credenciales
      # directamente (ver lib/Bootstrap-Keycloak.psm1, Get-KeycloakAdminToken).
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cis:
    build:
      context: ../../cis
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      KEYCLOAK_URL: http://id.${DOMINIO_BASE}
      KEYCLOAK_REALM: sicsaft
      # Constante fija, no generada por el bootstrap (a diferencia de CIS_ZITADEL_AUDIENCE, que
      # era el id de Proyecto que Zitadel generaba) — bootstrap-keycloak.ps1 crea un client scope
      # "cis-audience" con un Audience mapper fijo a este mismo valor, ver
      # lib/Bootstrap-Keycloak.psm1.
      KEYCLOAK_AUDIENCE: cis
      CORE_URL: http://core:3001
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN}
      # CIP entra a Nivel 1 on-premise desde 2026-08-25 (DOC-025 3, cierra INST-Q-01) -- ya no es
      # el workaround de relleno que era antes (cis/src/app.module.ts importa DashboardConnectorModule
      # de forma incondicional y valida CIP_URL/CIP_SERVICE_TOKEN al arrancar, cip-client.config.ts):
      # ahora apunta al servicio `cip` real de este mismo compose.
      CIP_URL: http://cip:3002
      CIP_SERVICE_TOKEN: ${CIP_SERVICE_TOKEN}
      # Solo el dominio local de este cliente — sin puertos de Vite (no hay `npm run dev` en una
      # instalación de cliente).
      CIS_CORS_ORIGIN: http://qr.${DOMINIO_BASE},http://ccp.${DOMINIO_BASE},http://admin.${DOMINIO_BASE},http://directivo.${DOMINIO_BASE}
      # Sin equivalente a ZITADEL_ORG_ID_MAP — Keycloak no lo necesita: el organizacionId que usa
      # el resto del ecosistema ES el alias de la Organization en Keycloak, decidido por CIS mismo
      # al crearla (slugificando el nombre, ver keycloak-admin.service.ts `crearOrganizacion`), no
      # un id externo que haya que mapear a mano acá.
      # Integración con la Admin REST API de Keycloak (alta de organización/usuarios desde
      # web-admin, DOC-021) — client confidencial con service account que crea
      # bootstrap-keycloak.ps1 (ver lib/Bootstrap-Keycloak.psm1). A diferencia del PAT estático de
      # Zitadel, este secreto autentica un flujo client_credentials — KeycloakAdminService lo
      # cambia por un token de vida corta y lo cachea (ver cis/src/keycloak-admin/).
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    networks:
      - sicsaft
    depends_on:
      keycloak:
        condition: service_started
      core:
        condition: service_healthy
      cip:
        condition: service_healthy
    restart: unless-stopped

  core-migrate:
    build:
      context: ../../core
      dockerfile: Dockerfile
    command: ["node", "scripts/migrate.js", "up"]
    environment:
      CORE_DB_HOST: postgres
      CORE_DB_PORT: 5432
      CORE_DB_NAME: core
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  core:
    build:
      context: ../../core
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN}
      CORE_DB_HOST: postgres
      CORE_DB_PORT: 5432
      CORE_DB_NAME: core
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      # ADR-005 — cola hacia el worker de CIP vía pg-boss, base dedicada (no la base `core`), ver
      # postgres/init/04-eventos-outbox.sh.
      EVENTOS_OUTBOX_DATABASE_URL: postgres://${EVENTOS_OUTBOX_DB_USER}:${EVENTOS_OUTBOX_DB_PASSWORD}@postgres:5432/eventos_outbox
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Sin router en traefik/dynamic.yml a propósito: CORE solo lo consume CIS, mismo criterio que
    # devops/local/ y devops/prod/.

  # CIP entra a Nivel 1 on-premise desde 2026-08-25 (DOC-025 3, cierra INST-Q-01) — antes solo
  # vivía en devops/local/. Mismo patrón que core-migrate/core: base propia `cip` (RNF-01/RNF-05),
  # consume eventos de CORE vía pg-boss (ADR-005, cola `cip-eventos`), sin Zitadel (no valida
  # identidad de operador, ver cip/README.md) y sin router en Traefik (ningún consumidor externo
  # todavía, mismo criterio que CORE).
  cip-migrate:
    build:
      context: ../../cip
      dockerfile: Dockerfile
    command: ["node", "scripts/migrate.js", "up"]
    environment:
      CIP_DB_HOST: postgres
      CIP_DB_PORT: 5432
      CIP_DB_NAME: cip
      CIP_DB_USER: ${CIP_DB_USER}
      CIP_DB_PASSWORD: ${CIP_DB_PASSWORD}
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  cip:
    build:
      context: ../../cip
      dockerfile: Dockerfile
    environment:
      PORT: 3002
      CIP_DB_HOST: postgres
      CIP_DB_PORT: 5432
      CIP_DB_NAME: cip
      CIP_DB_USER: ${CIP_DB_USER}
      CIP_DB_PASSWORD: ${CIP_DB_PASSWORD}
      CIP_SERVICE_TOKEN: ${CIP_SERVICE_TOKEN}
      CORE_URL: http://core:3001
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN}
      EVENTOS_OUTBOX_DATABASE_URL: postgres://${EVENTOS_OUTBOX_DB_USER}:${EVENTOS_OUTBOX_DB_PASSWORD}@postgres:5432/eventos_outbox
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
      cip-migrate:
        condition: service_completed_successfully
      core:
        condition: service_healthy
    restart: unless-stopped

  app-qr-sicsaft:
    build:
      context: ../../app-qr-sicsaft
      dockerfile: Dockerfile
      args:
        # INST-RF-05 — Vite hornea VITE_* en build time, así que esto debe construirse DESPUÉS de
        # correr bootstrap-keycloak.ps1 (ver README.md "Orden obligatorio").
        VITE_KEYCLOAK_ISSUER: http://id.${DOMINIO_BASE}
        VITE_KEYCLOAK_CLIENT_ID: ${APP_QR_VITE_KEYCLOAK_CLIENT_ID}
        VITE_CIS_URL: http://api.${DOMINIO_BASE}
    networks:
      - sicsaft
    depends_on:
      cis:
        condition: service_healthy
    restart: unless-stopped

  # web-admin y core-frontend van siempre (Nivel 1): el portal Directivo y el de Administrador
  # del Sistema se instalan junto con app-qr-sicsaft y ccp (ver más abajo).

  web-admin:
    build:
      context: ../../web_admin
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_ISSUER: http://id.${DOMINIO_BASE}
        VITE_KEYCLOAK_CLIENT_ID: ${WEB_ADMIN_VITE_KEYCLOAK_CLIENT_ID}
        VITE_CIS_URL: http://api.${DOMINIO_BASE}
    networks:
      - sicsaft
    depends_on:
      cis:
        condition: service_healthy
    restart: unless-stopped

  core-frontend:
    build:
      context: ../../core/frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_ISSUER: http://id.${DOMINIO_BASE}
        VITE_KEYCLOAK_CLIENT_ID: ${CORE_FRONTEND_VITE_KEYCLOAK_CLIENT_ID}
        VITE_CIS_URL: http://api.${DOMINIO_BASE}
    networks:
      - sicsaft
    depends_on:
      cis:
        condition: service_healthy
    restart: unless-stopped

  # CCP (Centro de Control Patrimonial) — portal del Profesional de AFT. Va en TODOS los niveles
  # (unificado con sicsaft-core.exe, 2026-09-02): el mismo servicio en Nivel 1 y Nivel 2. Lo único
  # que Nivel 2 agrega es el módulo Dashboard/indicadores (CIP), gateado por VITE_SICSAFT_NIVEL en
  # el build — no por un perfil de Compose. Antes estaba en `profiles: ["nivel2"]` ("CCP acotado
  # en Nivel 1"), revertido. `cip`/`cip-migrate` siguen arrancando desde el boot en ambos niveles
  # (CIS valida CIP_URL de forma incondicional — DOC-025 INST-Q-01); en Nivel 1 el contenedor
  # corre pero el Dashboard queda oculto en la UI.

  ccp:
    build:
      context: ../../ccp
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_ISSUER: http://id.${DOMINIO_BASE}
        VITE_KEYCLOAK_CLIENT_ID: ${CCP_VITE_KEYCLOAK_CLIENT_ID}
        VITE_CIS_URL: http://api.${DOMINIO_BASE}
        VITE_SICSAFT_NIVEL: ${NIVEL_PRODUCTO}
    networks:
      - sicsaft
    depends_on:
      cis:
        condition: service_healthy
    restart: unless-stopped
