# Config dinamica de Traefik para instalaciones onprem — provider "file" (ruteo estatico), mismo
# criterio que devops/local/traefik/dynamic.yml. Sin dashboard expuesto a proposito (INST-RNF-02,
# ver aidlc-docs/devops/requirements/REQUIREMENTS.md) y sin router de `grafana` (no se instala
# observabilidad en el PC del cliente).
http:
  routers:
    zitadel:
      rule: "Host(`id.sicsaft.localhost`)"
      entryPoints:
        - web
      service: zitadel
    cis:
      rule: "Host(`api.sicsaft.localhost`)"
      entryPoints:
        - web
      service: cis
    app-qr-sicsaft:
      rule: "Host(`qr.sicsaft.localhost`)"
      entryPoints:
        - web
      service: app-qr-sicsaft
    # Los 3 routers de abajo solo resuelven a algo si el perfil "nivel2" levantó esos servicios —
    # Traefik no falla si el servicio no está corriendo, solo devuelve 502 hasta que se levante.
    ccp:
      rule: "Host(`ccp.sicsaft.localhost`)"
      entryPoints:
        - web
      service: ccp
    web-admin:
      rule: "Host(`admin.sicsaft.localhost`)"
      entryPoints:
        - web
      service: web-admin
    core-frontend:
      rule: "Host(`directivo.sicsaft.localhost`)"
      entryPoints:
        - web
      service: core-frontend

  services:
    zitadel:
      loadBalancer:
        servers:
          - url: "http://zitadel:8080"
    cis:
      loadBalancer:
        servers:
          - url: "http://cis:3000"
    app-qr-sicsaft:
      loadBalancer:
        servers:
          - url: "http://app-qr-sicsaft:8080"
    ccp:
      loadBalancer:
        servers:
          - url: "http://ccp:8080"
    web-admin:
      loadBalancer:
        servers:
          - url: "http://web-admin:8080"
    core-frontend:
      loadBalancer:
        servers:
          - url: "http://core-frontend:8080"
