name: sicsaft-local

networks:
  sicsaft:
    driver: bridge

volumes:
  postgres_data:
  zitadel_data:

services:
  traefik:
    image: traefik:v3.1
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "80:80"
      - "8080:8080" # dashboard de Traefik, solo local — nunca exponer así en produccion
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    networks:
      sicsaft:
        # Zitadel es multi-tenant por dominio (ExternalDomain) — valida el Host de cada request
        # contra sus dominios registrados. Sin este alias, un contenedor (ej. `cis` pidiendo
        # JWKS) que le pega a Zitadel por el nombre de servicio interno (`zitadel:8080`) recibe
        # "Instance not found" (el Host no coincide con ningun dominio de la instancia) —
        # verificado real, no solo en teoria. El alias hace que `id.sicsaft.localhost` resuelva
        # DENTRO de la red Docker al propio Traefik, que enruta por Host igual que desde el host
        # — mismo dominio adentro y afuera, sin URLs internas especiales ni tocar headers.
        aliases:
          - id.sicsaft.localhost
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      ZITADEL_DB_USER: ${ZITADEL_DB_USER}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD}
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
    ports:
      # Expuesto al host solo para poder correr `npm run test:e2e`/desarrollo local de `core`
      # fuera de Docker contra la base real — no es necesario para que cis/core (dentro de la red
      # `sicsaft`) se conecten entre si.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - sicsaft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - /data # anonimo — cache/colas no necesitan persistir entre reinicios locales
    networks:
      - sicsaft
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.65.0
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_ADMIN_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: id.sicsaft.localhost
      ZITADEL_EXTERNALPORT: 80
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
    volumes:
      - zitadel_data:/zitadel
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cis:
    build:
      context: ../../cis
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      # `iss` del token lo pone Zitadel via ZITADEL_EXTERNALDOMAIN (arriba) — debe ser el mismo
      # valor exacto para que jwtVerify() lo acepte. Sin ZITADEL_JWKS_URI explicito, CIS deriva
      # el JWKS de este mismo issuer (ver loadZitadelAuthConfig) — funciona DENTRO de la red
      # Docker gracias al alias `id.sicsaft.localhost` del servicio `traefik` (arriba): Zitadel
      # es multi-tenant por dominio y rechaza requests cuyo Host no sea uno de sus dominios
      # registrados, por eso no alcanza con pegarle por el nombre de servicio interno
      # (`zitadel:8080`) sin ese alias.
      ZITADEL_ISSUER: http://id.sicsaft.localhost
      # Resource ID del proyecto OIDC creado en Zitadel para el CIS — ver
      # devops/local/README.md "Cliente OIDC real" para cómo crearlo. Sin esto el CIS no levanta
      # (loadZitadelAuthConfig valida al arrancar, ver cis/src/common/auth/zitadel-auth.config.ts).
      ZITADEL_AUDIENCE: ${CIS_ZITADEL_AUDIENCE}
      # URL interna de CORE dentro de la red de contenedores (ver servicio `core` abajo) — CIS la
      # usa para resolver entitlements reales en auth/session (DOC-004 §6), ya no un seed fijo.
      CORE_URL: http://core:3001
      # Secreto compartido de auth servicio-a-servicio CIS->CORE — debe ser exactamente el mismo
      # valor que CORE_SERVICE_TOKEN del servicio `core` (abajo). Generar con
      # `openssl rand -hex 32`, ver .env.example.
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN}
      # Redis para el rate limiter (WAF §4, src/rate-limit/) — mismo REDIS_PASSWORD que el
      # servicio `redis` (arriba). Primer consumidor de Redis en el codigo del ecosistema.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Origen permitido para CORS (TASK-007 de APP QR, ver app-qr-sicsaft/src/lib/qr-connector.ts)
      # — sin esto, ningun navegador puede llamar a CIS directo (solo servicio-a-servicio, que no
      # pasa por CORS). Puerto de Vite en dev; agregar el dominio real cuando exista deploy.
      CIS_CORS_ORIGIN: http://localhost:5173
    networks:
      - sicsaft
    depends_on:
      zitadel:
        condition: service_started
      core:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Migraciones de CORE (node-pg-migrate, ver core/migrations/) — corre una vez, aplica el
  # esquema real y sale. `02-core.sh` solo crea la base/usuario vacios; el esquema ya no se
  # aplica desde un init script de Postgres (no versionado, sin down) sino acá.
  core-migrate:
    build:
      context: ../../core
      dockerfile: Dockerfile
    command: ["node", "scripts/migrate.js", "up"]
    environment:
      CORE_DB_HOST: postgres
      CORE_DB_PORT: 5432
      CORE_DB_NAME: core
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  core:
    build:
      context: ../../core
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      # Mismo valor que CORE_SERVICE_TOKEN del servicio `cis` (arriba) — CORE valida este header
      # en cada request (ver core/src/common/auth/service-token.guard.ts), no confia en la red
      # por si sola.
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN}
      # Base de datos real de Base Patrimonial (modelo de Contrato, DOC-004) — reemplaza el seed
      # en memoria que usaba antes EntitlementsService. Base/usuario dedicados dentro del mismo
      # postgres compartido (ver servicio `postgres` arriba y su init/02-core.sh), nunca la base
      # `zitadel`.
      CORE_DB_HOST: postgres
      CORE_DB_PORT: 5432
      CORE_DB_NAME: core
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Sin router en traefik/dynamic.yml a propósito: CORE solo lo consume CIS dentro de la red
    # de contenedores (ver README raíz — "todo pasa por CIS → CORE"), nunca un navegador
    # directo. Se agrega un router acá si esa regla cambia alguna vez.
