# Config de Prometheus del stack local — mismo criterio que traefik/dynamic.yml: config estatica
# versionada, sin auto-discovery contra el socket de Docker (Enhanced Container Isolation de
# Docker Desktop en Windows lo bloquea, ver el comentario de traefik/dynamic.yml para el mismo
# problema ya documentado ahi).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metricas de host (CPU/mem/disco/red) — equivalente a lo que CloudWatch da gratis por instancia
  # EC2, pero self-hosted.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Metricas por contenedor (CPU/mem/red/IO por servicio) — equivalente a CloudWatch Container
  # Insights.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Prometheus se scrapea a si mismo (metricas de salud del propio scraper).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # /metrics real (prom-client via @willsoto/nestjs-prometheus) en los 3 backends NestJS — ver
  # devops/local/README.md "Observabilidad". CIS tiene router publico en Traefik (a diferencia de
  # core/cip) — ver el comentario en cis/src/app.module.ts sobre exposicion antes de replicar este
  # mismo patron en devops/prod/.
  - job_name: cis
    static_configs:
      - targets: ["cis:3000"]
  - job_name: core
    static_configs:
      - targets: ["core:3001"]
  - job_name: cip
    static_configs:
      - targets: ["cip:3002"]
