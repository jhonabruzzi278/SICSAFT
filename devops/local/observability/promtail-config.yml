# Promtail — envia los logs de TODOS los contenedores del stack a Loki, sin tocar codigo de
# aplicacion (cis/core/etc siguen logueando a stdout como ya hacen, Promtail solo los recolecta).
# Descubrimiento via el socket de Docker (docker_sd_configs) — a diferencia de Traefik (ver
# traefik/dynamic.yml), Promtail SI puede leer el socket montado read-only sin pasar por la API de
# management de Docker Desktop, mismo patron documentado en la guia oficial de Grafana Loki.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # docker_sd_configs descubre TODOS los contenedores del host Docker, no solo los de este
      # stack (verificado real: sin este filtro, contenedores de otros proyectos del mismo Docker
      # Desktop terminaban en Loki) — se descartan acá, antes de cualquier otro relabel.
      - source_labels: [__meta_docker_container_name]
        regex: "/sicsaft-local-.*"
        action: keep
      # Nombre del contenedor sin el "/" inicial que docker_sd antepone.
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: "/(.*)"
        replacement: "$1"
      # Nombre del servicio de compose, sin el sufijo "-N" de instancia — queda como label
      # `service` en Loki/Grafana (ej. "sicsaft-local-cis-1" -> "cis").
      - source_labels: [__meta_docker_container_name]
        regex: "/sicsaft-local-(.+)-1"
        target_label: service
      # Label fijo, sin `source_labels` — garantiza que todo stream tenga al menos un label
      # incluso si algún nombre de contenedor no matchea los patrones de arriba (ej. contenedores
      # de migración que ya salieron). Verificado real: sin esto Loki rechazaba streams con
      # "at least one label pair is required" cuando los otros dos relabels no aplicaban.
      - target_label: job
        replacement: docker
