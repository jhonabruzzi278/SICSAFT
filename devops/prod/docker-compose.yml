# Stack de producción para desplegar como recurso "Docker Compose" en Coolify, sobre el VPS
# propio (ver devops/README.md "Modelo de despliegue: VPS propio, Docker Compose" — Coolify no
# cambia esa decisión, es solo el panel/proxy/orquestador que corre sobre el mismo VPS, nunca un
# PaaS gestionado de terceros).
#
# Diferencias reales contra devops/local/docker-compose.yml (ver ese archivo para el detalle
# comentado de cada variable — acá solo se documenta lo que cambia):
#
# 1. Sin servicio `traefik` propio: Coolify trae su propio proxy (Traefik) compartido para todos
#    los recursos de la instancia. Asignar el dominio real de cada servicio expuesto abajo desde
#    la pestaña "Domains" de ese servicio en el panel de Coolify (no hace falta editar labels de
#    Traefik a mano) — Coolify emite el certificado TLS solo (Let's Encrypt) apenas el dominio
#    resuelve al VPS.
# 2. Sin puertos de host expuestos en `postgres` (en local existen solo para poder correr
#    tests fuera de Docker) — en producción reduce superficie de ataque, ver devops/README.md
#    "Cyberseguridad del VPS" ("Solo 80/443 públicos").
# 3. Sin el alias de red `id.sicsaft.localhost` en el proxy: ese truco existía para que Zitadel
#    (multi-tenant por Host header) resolviera su propio dominio DESDE DENTRO de la red Docker en
#    Docker Desktop (Windows/Mac), que aísla el acceso al socket del daemon. En el VPS real
#    (Linux, DNS público real), cualquier contenedor que le hable a `https://id.sicsaft.cl` sale a
#    internet y vuelve a entrar por el proxy de Coolify con el Host correcto — no hace falta el
#    alias.
# 4. Variables sin secreto real acá (mismos nombres `${VAR}` que devops/local/.env.example) — los
#    valores viven en el gestor de variables nativo de Coolify (una variable de entorno por
#    servicio o compartida a nivel de proyecto), no en un archivo `.env` ni cifradas con SOPS+age
#    (decisión revisada — ver devops/prod/README.md "Decisión revisada" para el porqué).
# 5. Dominios reales bajo `sicsaft.cl` (ver devops/README.md "Dominios") en vez de
#    `*.sicsaft.localhost` — usados solo como referencia en variables VITE_*/ZITADEL_* que se
#    hornean en build time o se validan al arrancar; el ruteo real lo decide el campo "Domains" de
#    Coolify, no estos valores.
# 6. Toda la config de observabilidad (Prometheus, Promtail, provisioning de Grafana) y el
#    build/init de `postgres` son copias propias bajo `./observability/`/`./postgres/`, no
#    referencias relativas a `devops/local/` — ver devops/prod/README.md "Hallazgo real" (Coolify
#    no resuelve de forma confiable un bind mount cuyo origen usa `..` para salir del directorio
#    del compose file). `loki` además tiene contenido propio a propósito (retención 30 días vs.
#    7 en local); el resto es copia idéntica al momento de escribirla, sin sincronización
#    automática si diverge.
# 7. `prometheus` recibe METRICS_TOKEN como Docker secret (no env var) — lee el bearer token para
#    scrapear `GET /metrics` de CIS desde un archivo (`bearer_token_file`), nunca commiteado
#    (ver devops/prod/observability/prometheus.yml y devops/prod/README.md "Hallazgo real").
# 7. `depends_on` usa `condition: service_healthy` (no solo `service_started`) contra `cis`/
#    `core`/`cip` porque sus Dockerfile ya definen `HEALTHCHECK` real contra `GET /health` — mismo
#    cambio aplicado también en devops/local/docker-compose.yml, no es exclusivo de prod.

name: sicsaft-prod

networks:
  sicsaft:
    driver: bridge

volumes:
  postgres_data:
  zitadel_data:
  prometheus_data:
  loki_data:
  grafana_data:

secrets:
  # Fuente = variable de entorno METRICS_TOKEN (cargada en el panel de Coolify, nunca en este
  # archivo) — Compose la expone como archivo en /run/secrets/metrics_token dentro de los
  # servicios que la listan abajo, en vez de interpolarla en texto plano dentro de
  # observability/prometheus.yml (ese sí queda commiteado). Ver devops/prod/README.md "Hallazgo
  # real".
  metrics_token:
    environment: METRICS_TOKEN

services:
  postgres:
    # Mismo build que devops/local/ (pgaudit no viene precompilado en postgres:16-alpine) --
    # copia propia en ./postgres (ver devops/prod/README.md "Hallazgo real": Coolify no resuelve
    # de forma confiable un bind mount/build context cuyo origen usa `..` para salir del
    # directorio del compose file, antes referenciaba ../local/postgres por relativa). Sin esto,
    # el init de abajo (postgres/init/02-core.sh) falla: intenta CREATE EXTENSION pgaudit contra
    # una imagen que no la tiene.
    build:
      context: ./postgres
      dockerfile: Dockerfile
    # Mismo motivo que devops/local/docker-compose.yml -- shared_preload_libraries es de servidor
    # completo, requiere estar antes de aceptar conexiones (no alcanza con CREATE EXTENSION solo).
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pgaudit"
      - "-c"
      - "pgaudit.log=write, ddl, role"
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      ZITADEL_DB_USER: ${ZITADEL_DB_USER}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD}
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      CIP_DB_USER: ${CIP_DB_USER}
      CIP_DB_PASSWORD: ${CIP_DB_PASSWORD}
      # ADR-005 — base dedicada para la cola de eventos CORE→CIP (pg-boss), ver
      # postgres/init/04-eventos-outbox.sh.
      EVENTOS_OUTBOX_DB_USER: ${EVENTOS_OUTBOX_DB_USER}
      EVENTOS_OUTBOX_DB_PASSWORD: ${EVENTOS_OUTBOX_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - sicsaft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.65.0
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}" --tlsMode external
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_ADMIN_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Dominio real — Coolify termina el TLS público en su proxy y reenvía HTTP en texto plano
      # dentro de la red interna, por eso EXTERNALSECURE sigue en "true" (asi lo ve el navegador)
      # aunque el propio contenedor hable HTTP puro (mismo patrón que el `--tlsMode disabled` de
      # local, acá `external` — Zitadel confía en que el proxy de adelante ya terminó el TLS).
      ZITADEL_EXTERNALDOMAIN: id.sicsaft.cl
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
    expose:
      - "8080" # puerto interno que Coolify enruta desde el dominio asignado en su panel
    volumes:
      - zitadel_data:/zitadel
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cis:
    build:
      context: ../../cis
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      ZITADEL_ISSUER: https://id.sicsaft.cl
      ZITADEL_AUDIENCE: ${CIS_ZITADEL_AUDIENCE}
      CORE_URL: http://core:3001
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN}
      CIP_URL: http://cip:3002
      CIP_SERVICE_TOKEN: ${CIP_SERVICE_TOKEN}
      # Protege GET /metrics -- CIS sí tiene router público en Coolify (a diferencia de
      # core/cip), ver cis/src/common/metrics/metrics-token.guard.ts y devops/prod/README.md
      # "Hallazgo real". Como env var normal (no secret) porque CIS ya lee todo lo demás así.
      METRICS_TOKEN: ${METRICS_TOKEN}
      # Solo los 3 portales reales de producción — sin puertos de Vite (eso era solo para
      # `npm run dev` local).
      CIS_CORS_ORIGIN: https://app.sicsaft.cl,https://directivo.sicsaft.cl
      # Entre comillas a propósito: es JSON literal (ej. {"<org-id>":"duoc-uc"}) — sin comillas,
      # Docker Compose interpola el valor DENTRO del YAML antes de parsearlo, y `{"a":"b"}` sin
      # comillas es un mapping YAML válido, no el string que CIS espera recibir y hacerle
      # `JSON.parse()` (mismo motivo por el que devops/local/docker-compose.yml ya lo entrecomilla
      # con el valor hardcodeado de desarrollo).
      ZITADEL_ORG_ID_MAP: "${ZITADEL_ORG_ID_MAP}"
      ZITADEL_ADMIN_TOKEN: ${ZITADEL_ADMIN_TOKEN}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID}
    expose:
      - "3000"
    networks:
      - sicsaft
    depends_on:
      # zitadel se queda en `service_started`: la imagen oficial no trae HEALTHCHECK y es una
      # imagen mínima (sin shell/wget utilizables desde un healthcheck exec) — no se puede armar
      # uno confiable sin verificarlo contra una instancia real primero. core/cip sí lo tienen
      # (HEALTHCHECK real en su Dockerfile contra GET /health), así que ahí sí exigimos
      # service_healthy en vez de solo "el proceso arrancó".
      zitadel:
        condition: service_started
      core:
        condition: service_healthy
      cip:
        condition: service_healthy
    restart: unless-stopped

  core-migrate:
    build:
      context: ../../core
      dockerfile: Dockerfile
    command: ["node", "scripts/migrate.js", "up"]
    environment:
      CORE_DB_HOST: postgres
      CORE_DB_PORT: 5432
      CORE_DB_NAME: core
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  core:
    build:
      context: ../../core
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN}
      CORE_DB_HOST: postgres
      CORE_DB_PORT: 5432
      CORE_DB_NAME: core
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      # ADR-005 — cola hacia el worker de CIP vía pg-boss, base dedicada (no la base `core`), ver
      # postgres/init/04-eventos-outbox.sh.
      EVENTOS_OUTBOX_DATABASE_URL: postgres://${EVENTOS_OUTBOX_DB_USER}:${EVENTOS_OUTBOX_DB_PASSWORD}@postgres:5432/eventos_outbox
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Sin `expose`/dominio a propósito: CORE solo lo consume CIS dentro de la red interna, nunca
    # un navegador directo — mismo criterio que devops/local/docker-compose.yml.

  cip-migrate:
    build:
      context: ../../cip
      dockerfile: Dockerfile
    command: ["node", "scripts/migrate.js", "up"]
    environment:
      CIP_DB_HOST: postgres
      CIP_DB_PORT: 5432
      CIP_DB_NAME: cip
      CIP_DB_USER: ${CIP_DB_USER}
      CIP_DB_PASSWORD: ${CIP_DB_PASSWORD}
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  cip:
    build:
      context: ../../cip
      dockerfile: Dockerfile
    environment:
      PORT: 3002
      CIP_DB_HOST: postgres
      CIP_DB_PORT: 5432
      CIP_DB_NAME: cip
      CIP_DB_USER: ${CIP_DB_USER}
      CIP_DB_PASSWORD: ${CIP_DB_PASSWORD}
      CIP_SERVICE_TOKEN: ${CIP_SERVICE_TOKEN}
      CORE_URL: http://core:3001
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN}
      EVENTOS_OUTBOX_DATABASE_URL: postgres://${EVENTOS_OUTBOX_DB_USER}:${EVENTOS_OUTBOX_DB_PASSWORD}@postgres:5432/eventos_outbox
    networks:
      - sicsaft
    depends_on:
      postgres:
        condition: service_healthy
      cip-migrate:
        condition: service_completed_successfully
      core:
        condition: service_healthy
    restart: unless-stopped
    # Sin `expose`/dominio a propósito, mismo criterio que `core`: sin frontend todavía (DOC-018
    # 7.2 — decisión abierta).

  ccp:
    build:
      context: ../../ccp
      dockerfile: Dockerfile
      args:
        VITE_ZITADEL_ISSUER: https://id.sicsaft.cl
        VITE_ZITADEL_CLIENT_ID: ${WEB_VITE_ZITADEL_CLIENT_ID}
        VITE_CIS_URL: https://api.sicsaft.cl
    expose:
      - "8080"
    networks:
      - sicsaft
    depends_on:
      cis:
        condition: service_healthy
    restart: unless-stopped

  core-frontend:
    build:
      context: ../../core/frontend
      dockerfile: Dockerfile
      args:
        VITE_ZITADEL_ISSUER: https://id.sicsaft.cl
        VITE_ZITADEL_CLIENT_ID: ${CORE_FRONTEND_VITE_ZITADEL_CLIENT_ID}
        VITE_CIS_URL: https://api.sicsaft.cl
    expose:
      - "8080"
    networks:
      - sicsaft
    depends_on:
      cis:
        condition: service_healthy
    restart: unless-stopped

  # --- Observabilidad self-hosted — mismos archivos de config que devops/local/, ver
  # devops/local/README.md "Observabilidad" para el detalle de cada componente.

  node-exporter:
    image: prom/node-exporter:v1.8.2
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - sicsaft
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - sicsaft
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Monta METRICS_TOKEN en /run/secrets/metrics_token -- prometheus.yml lo lee de ahí
    # (bearer_token_file) para autenticar el scrape de GET /metrics de CIS.
    secrets:
      - metrics_token
    networks:
      - sicsaft
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      # Config propia, no compartida con local — la retención de logs es distinta (ver
      # devops/prod/observability/loki-config.yml).
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - sicsaft
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sicsaft
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://grafana.sicsaft.cl/"
    expose:
      - "3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - sicsaft
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
